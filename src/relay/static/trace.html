<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>跨端任务追踪 · YAgent Relay</title>
<style>
  /* ==========================================================================
     配色与排版直接沿用 YAgent Desk 自身的设计 token
     （src/renderer/src/styles/index.scss 与 GameEditorWorkspace/vendor/tokens.css），
     不再自己另起一套——看板是这套产品的一部分，长得像它才不突兀。

       背景  #f7f7f5 暖白    面板 #f1f1ee / #efefec 暖灰
       描边  #deded9 / #e1e5eb   文字 #252522 / #1a1916
       强调  #c96442 陶土橙（产品的主色，不是蓝）
       语义  绿 #1f7a3a / 红 #9c2a25 / 琥珀 #b26200 / 蓝 #2348b8

     信息层级仍然按上一版的三条规矩：靠字号字重留白分级，颜色只表达
     「谁发起的」和「什么状态」，一屏只有一个强调色。
     ========================================================================== */
  :root {
    --bg: #f7f7f5;
    --bg-app: #faf9f7;
    --panel: #fdfcfa;
    --panel-2: #f1f1ee;
    --panel-3: #efefec;
    --fill: rgba(0,0,0,.03);
    --fill-2: rgba(0,0,0,.06);

    --line: #deded9;
    --line-2: #e1e5eb;
    --line-soft: #edf0f4;

    --ink: #1a1916;
    --ink-2: #3d3d38;
    --ink-3: #74716b;
    --ink-4: #989590;
    --ink-5: #b3b0a8;

    --accent: #c96442;
    --accent-strong: #b45a3b;
    --accent-tint: #fbeee5;

    --green: #1f7a3a;   --green-bg: #e8f7ee;   --green-bd: #c6ead2;
    --red: #9c2a25;     --red-bg: #fdecea;     --red-bd: #f5c6c2;
    --amber: #b26200;   --amber-bg: #fff3e0;   --amber-bd: #f2ddb8;
    --blue: #2348b8;    --blue-bg: #e8efff;    --blue-bd: #c8d6ff;
    --purple: #6c3aa6;  --purple-bg: #f3ecf9;  --purple-bd: #e4d4f1;

    --sh-xs: 0 1px 0 rgba(28,27,26,.04);
    --sh-sm: 0 1px 2px rgba(28,27,26,.05), 0 1px 3px rgba(28,27,26,.04);
    --sh-md: 0 6px 24px rgba(28,27,26,.07), 0 2px 6px rgba(28,27,26,.04);
    --sh-lg: 0 24px 60px rgba(28,27,26,.16), 0 8px 16px rgba(28,27,26,.07);

    --sans: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  ::selection { background: var(--accent-tint); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d5d5d0; border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #c2c2bc; }
  ::-webkit-scrollbar-track { background: transparent; }
  .mono { font-family: var(--mono); }
  .num { font-variant-numeric: tabular-nums; }

  /* ============================ 顶栏 ============================ */
  header {
    display: flex; align-items: center; gap: 16px; flex: none;
    height: 60px; padding: 0 16px;
    background: var(--panel-2); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 28px; height: 28px; flex: none; border-radius: 9px;
    background: #1f1f1d; color: #fff; font-weight: 700; font-size: 13px;
    display: grid; place-items: center;
  }
  .brand .tt { min-width: 0; }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; color: #55554f;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .sub { font-size: 11px; color: var(--ink-4); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .ctrl { display: flex; align-items: center; gap: 8px; }

  select, input[type=text], input[type=date] {
    appearance: none; -webkit-appearance: none;
    background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font: inherit; font-size: 12px; outline: none;
    transition: border-color .14s, box-shadow .14s, background .14s;
  }
  select:hover, input:hover { border-color: #c9c9c3; }
  select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  select { cursor: pointer; padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-4) 50%),
                      linear-gradient(135deg, var(--ink-4) 50%, transparent 50%);
    background-position: calc(100% - 14px) 51%, calc(100% - 10px) 51%;
    background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
  input[type=text] { width: 200px; }
  input[type=date] { width: 124px; }

  .seg { display: flex; gap: 2px; background: #e8e8e3; border-radius: 9px; padding: 3px; }
  .seg .sg {
    padding: 6px 15px; font-size: 12px; font-weight: 600; border-radius: 7px;
    cursor: pointer; color: #6c6c64; user-select: none; transition: .14s; white-space: nowrap;
  }
  .seg .sg:hover { color: #45453f; }
  .seg .sg.on { background: var(--panel); color: var(--ink); box-shadow: var(--sh-xs); }

  .live { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-4);
    padding-left: 4px; }
  .live .d { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-5); transition: .3s; }
  .live .d.on { background: var(--green); }
  .live .d.off { background: var(--red); }

  /* ============================ 指标条 ============================ */
  .stats { display: flex; align-items: stretch; flex: none; height: 64px;
    padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .st { display: flex; flex-direction: column; justify-content: center;
    padding: 0 20px; position: relative; min-width: 0; }
  .st:first-child { padding-left: 4px; }
  .st + .st::before { content: ''; position: absolute; left: 0; top: 18px; bottom: 18px;
    width: 1px; background: var(--line); }
  .st .k { font-size: 11px; color: var(--ink-4); white-space: nowrap; margin-bottom: 1px; }
  .st .v { font-size: 17px; font-weight: 600; color: var(--ink-2);
    font-variant-numeric: tabular-nums; line-height: 1.2; }
  .st.hero .v { font-size: 24px; color: var(--ink); }
  .st .v.hot { color: var(--accent); }
  .st .v.bad { color: var(--red); }
  .st .v.z { color: var(--ink-5); font-weight: 500; }
  .st.hide { display: none; }
  .stats-sp { flex: 1; }

  /* ============================ 主体 ============================ */
  main { flex: 1; display: grid; grid-template-columns: 212px minmax(0, 1fr); min-height: 0; }
  .side { background: var(--panel-3); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; }
  .main-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }

  .colhead { display: flex; align-items: center; gap: 14px; flex: none;
    height: 48px; padding: 0 18px; border-bottom: 1px solid var(--line);
    background: var(--panel); }
  .colhead h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--ink); }
  .colhead .hint { font-size: 11px; color: var(--ink-4); }
  .tabs { display: flex; gap: 14px; }
  .tabs .tb { font-size: 12px; color: var(--ink-3); cursor: pointer; padding: 3px 0;
    border-bottom: 1.5px solid transparent; transition: .14s; user-select: none; font-weight: 500; }
  .tabs .tb:hover { color: var(--ink-2); }
  .tabs .tb.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .scroller { flex: 1; overflow: auto; min-height: 0; }

  /* ---------------------------- 用户侧栏 ---------------------------- */
  .usearch { padding: 10px 10px 6px; flex: none; }
  .usearch input { width: 100%; background: var(--panel); font-size: 12px; }
  .user { padding: 7px 10px; margin: 0 6px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; }
  .user:hover { background: #e6e6e1; }
  .user.on { background: #e4ece6; }
  .user .nm { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 500; color: #45453f;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user.on .nm { color: #2f6f4f; font-weight: 600; }
  .user .ct { flex: none; font-size: 10px; font-weight: 600; color: #7b7b73;
    background: #dfdfda; border-radius: 8px; padding: 0 5px; line-height: 15px; }
  .user .ct.a { background: var(--accent-tint); color: var(--accent-strong); }
  .user .ct.b { background: var(--red-bg); color: var(--red); }
  .user .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; }
  .user.all { font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .user.all.on { color: #2f6f4f; }

  /* ---------------------------- 列表 ---------------------------- */
  .list { padding: 8px 10px 40px; }
  .row { background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px;
    padding: 12px 14px 12px 16px; margin-bottom: 8px; cursor: pointer; position: relative;
    transition: border-color .14s, box-shadow .14s; }
  .row:hover { border-color: #cfd5dd; box-shadow: var(--sh-sm); }
  .row.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  /* 状态色只落在左侧这根色条上，不铺满整行 */
  .row .rail { position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--c, var(--ink-5)); }

  /* 任务视图：一条链路一张卡片。卡片边界就是任务边界 ——
     让「哪些消息属于同一件事」一眼可见，而不是散在流水列表里靠小标认亲 */
  .glist { padding: 8px 10px 40px; }
  .gcard { background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px;
    margin-bottom: 14px; overflow: hidden; box-shadow: var(--sh-sm); }
  .gcard.act { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .gh { display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    background: var(--ink-1, #f7f8fa); border-bottom: 1px solid var(--line-2);
    border-left: 4px solid var(--c, var(--ink-5)); }
  .gh .gn { font-size: 12px; font-weight: 600; color: var(--ink-60, #606a76);
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
  .gh .gsum { font-size: 13px; font-weight: 600; color: var(--ink-90, #1f2933);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52%; }
  .gh .gbadge.run { font-size: 11px; color: #1b6ef3; background: #eaf2ff;
    border: 1px solid #c3dbff; border-radius: 999px; padding: 1px 8px; }
  .gh { cursor: pointer; }
  .gh:hover { background: #eef1f5; }
  /* 默认折叠：只看到一行源头摘要，点头部展开 */
  /* 参与通信的用户：紧跟摘要放在左边，靠右的话宽屏上跟摘要隔得太远，根本注意不到 */
  .gh .gusers { flex: none; font-size: 11.5px; font-weight: 600; color: var(--ink-2, #3a4452);
    background: var(--panel-2, #f2f4f6); border: 1px solid var(--line, #e3e6ea);
    border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
  .gcard.fold .gbody { display: none; }
  .gcaret { display: inline-block; font-size: 14px; color: var(--ink-40, #9aa4b0);
    transition: transform .14s; transform: rotate(0deg); width: 10px; }
  .gcaret.open { transform: rotate(90deg); }
  .gh .gmap { font-size: 12px; color: var(--accent, #1b6ef3); background: var(--panel);
    border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 9px; cursor: pointer;
    opacity: 0; transition: opacity .12s; }
  .gh:hover .gmap, .gcard:not(.fold) .gh .gmap { opacity: 1; }
  .gh .gmap:hover { border-color: var(--accent, #1b6ef3); background: var(--accent-tint, #eaf2ff); }
  .gbody { padding: 6px 10px 8px; }
  /* 缩进直接用后端算好的 depth，前端不再重建一遍树 */
  .gr { position: relative; cursor: pointer; border-radius: 8px;
    padding: 7px 10px 7px 14px; margin: 3px 0 3px calc(var(--d, 0) * 22px);
    border: 1px solid transparent; transition: background .12s, border-color .12s; }
  .gr:hover { background: var(--ink-1, #f7f8fa); border-color: var(--line-2); }
  .gr.on { border-color: var(--accent); background: var(--accent-tint); }
  .gr .grail { position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--c, var(--ink-5)); }
  .gr .gtee, .gr .gdot { color: var(--ink-40, #9aa4b0); font-size: 11px; margin-right: 2px; }
  .gr .gdot { color: var(--c, var(--ink-5)); }

  /* 调用链：按 parent_msg_id 串起来的任务树，缩进表示层级。
     回答的是「这次任务经过了谁」，与下方会话图的「这两个会话处得怎么样」互补 */
  .chain { margin: 0 0 14px; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
  .chead { padding: 8px 12px; font-size: 12px; color: var(--ink-3);
    background: var(--fill); border-bottom: 1px solid var(--line-2); }
  .crow { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;
    padding: 7px 12px 7px calc(12px + var(--d, 0) * 18px);
    border-left: 3px solid var(--c, var(--ink-5)); border-bottom: 1px solid var(--line-soft); }
  .crow:last-child { border-bottom: 0; }
  .crow:hover { background: var(--fill); }
  .crow.cur { background: var(--accent-tint); font-weight: 600; }
  .cw { white-space: nowrap; color: var(--ink-2); }
  .cw .dir { margin: 0 5px; color: var(--ink-5); }
  .csum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--ink-3); }

  .link-directions { margin-top:8px; font-size:12px; color:var(--ink-3); line-height:1.7; overflow-wrap:anywhere; }
  .l1 { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap:wrap; }
  .l2 { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; padding-left: 0; min-width: 0; }
  .grow { flex: 1; min-width: 0; }

  /* 参与方：第一重要的信息。用字号 + 字重 + 方向色，不加底框 */
  .who { font-size: 14.5px; font-weight: 600; letter-spacing: -.005em; white-space: nowrap; }
  .who.a { color: var(--ink); }
  .who.b { color: #55554f; }
  .who .ss { margin-left: 6px; font-size: 10.5px; font-weight: 400; color: var(--ink-4);
    font-family: var(--mono); letter-spacing: 0; }
  .dir { flex: none; color: var(--accent); font-size: 14px; line-height: 1; font-weight: 700; }
  .dir.r { color: var(--ink-5); font-weight: 400; }

  .sum { font-size: 12.5px; color: var(--ink-3); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .sum.hi { color: var(--ink-2); }
  .none { font-size: 12px; color: var(--ink-5); }

  /* 状态徽标：沿用产品 token 里的语义色浅底 + 描边 */
  .pill { display: inline-flex; align-items: center; gap: 5px; flex: none;
    border-radius: 20px; padding: 2px 9px; font-size: 11px; font-weight: 600;
    background: var(--pbg); color: var(--pfg); border: 1px solid var(--pbd); white-space: nowrap; }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .pill.on i { animation: bp 1.5s ease-in-out infinite; }
  @keyframes bp { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .bits { display: inline-flex; align-items: center; gap: 6px; flex: none; }
  .bit { font-size: 11px; font-weight: 600; border-radius: 20px; padding: 2px 8px;
    white-space: nowrap; border: 1px solid transparent; }
  .bit.d { background: var(--fill); color: var(--ink-3); border-color: var(--line-2); }
  .bit.y { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-bd); }
  .bit.r { background: var(--red-bg); color: var(--red); border-color: var(--red-bd); }
  .bit.p { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-bd); }
  .bit.b { background: var(--blue-bg); color: var(--blue); border-color: var(--blue-bd); }

  .met { font-size: 11px; color: var(--ink-4); white-space: nowrap;
    font-variant-numeric: tabular-nums; }
  .tp { display: inline-flex; align-items: baseline; gap: 5px; flex: none; }
  .tp b { font-size: 16px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .tp span { font-size: 10.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }

  .ball { display: inline-flex; align-items: center; gap: 7px; margin-top: 8px;
    font-size: 11.5px; color: var(--ink-3); }
  .ball .ic { color: var(--accent); font-size: 9px; }
  .ball .nm { color: var(--ink-2); font-weight: 600; }
  .ball .sl { color: var(--amber); font-weight: 600; }
  .ball .sep { color: var(--ink-5); }

  .empty { padding: 64px 24px; text-align: center; }
  .empty .big { font-size: 13px; color: var(--ink-3); font-weight: 500; }
  .empty .sm { font-size: 12px; color: var(--ink-4); margin-top: 7px; line-height: 1.8; }
  .pager { display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 18px; color: var(--ink-4); font-size: 12px; }
  .pager button { background: var(--panel); color: var(--ink-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 15px; font: inherit; font-size: 12px; cursor: pointer;
    font-weight: 500; transition: .14s; }
  .pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .foot { padding: 4px 16px 24px; color: var(--ink-4); font-size: 11.5px; }

  /* ============================ 抽屉 ============================ */
  .scrim { position: fixed; inset: 0; background: rgba(28,27,26,.28); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(1100px, 96vw); z-index: 41;
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .24s cubic-bezier(.32,.72,0,1);
    display: flex; flex-direction: column; box-shadow: var(--sh-lg); }
  .panel.open { transform: translateX(0); }
  .ph { flex: none; padding: 18px 20px 16px; border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; background: var(--panel-2); }
  .ph .grow { flex: 1; min-width: 0; }
  .ph .sub { margin-top: 8px; font-size: 11px; color: var(--ink-4); }
  .ph .sub:empty { display: none; margin: 0; }
  /* 标题 = 根任务摘要 + 参与用户 */
  #d-title .dflow { margin-left: 12px; font-size: 12px; font-weight: 600;
    color: var(--ink-3); white-space: nowrap; }
  .ph .sub em { font-style: normal; font-family: var(--mono); color: var(--ink-3); }
  .xbtn { flex: none; width: 28px; height: 28px; border-radius: 8px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink-3);
    font-size: 16px; line-height: 1; transition: .14s; }
  .xbtn:hover { color: var(--ink); border-color: #c9c9c3; }
  .pb { flex: 1; overflow: auto; padding: 18px 20px 40px; }

  .kv { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 9px 14px;
    margin: 0; font-size: 12.5px; }
  .kv dt { color: var(--ink-4); font-size: 12px; }
  .kv dd { margin: 0; min-width: 0; word-break: break-word; color: var(--ink-2); }
  .kv dd.m { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

  .sect { display: flex; align-items: center; gap: 10px; margin: 22px 0 12px; }
  .sect:first-child { margin-top: 0; }
  .sect .t { font-size: 11px; font-weight: 600; color: var(--ink-4);
    letter-spacing: .04em; white-space: nowrap; }
  .sect .ln { flex: 1; height: 1px; background: var(--line); }

  .mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
    background: var(--line-2); border: 1px solid var(--line-2); border-radius: 10px;
    overflow: hidden; }
  .mg { background: var(--panel); padding: 10px 12px; }
  .mg .k { font-size: 11px; color: var(--ink-4); }
  .mg .v { margin-top: 2px; font-size: 16px; font-weight: 600; color: var(--ink-2);
    font-variant-numeric: tabular-nums; }
  .mg .v .u { font-size: 11px; font-weight: 400; color: var(--ink-4); margin-left: 2px; }

  .turn { border: 1px solid var(--line-2); border-radius: 10px; padding: 11px 13px;
    margin-bottom: 8px; cursor: pointer; background: var(--panel); transition: .14s; }
  .turn:hover { border-color: #cfd5dd; }
  .turn.open { border-color: var(--accent); }
  .turn .tl1 { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .turn .no { flex: none; width: 18px; font-size: 10.5px; font-weight: 600;
    color: var(--ink-4); font-family: var(--mono); }
  .turn .tt { margin-top: 7px; padding-left: 27px; font-size: 12.5px; color: var(--ink-2);
    word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .turn.open .tt { -webkit-line-clamp: unset; }
  .turn .tm { margin-top: 6px; padding-left: 27px; font-size: 11px; color: var(--ink-4);
    font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .frames { margin: -6px 0 10px; padding: 10px 13px; background: var(--panel-2);
    border: 1px solid var(--line-2); border-top: none; border-radius: 0 0 10px 10px; }

  .tl .it { position: relative; padding: 7px 0 7px 16px; }
  .tl .it::before { content: ''; position: absolute; left: 0; top: 13px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--ink-5); }
  .tl .it::after { content: ''; position: absolute; left: 2px; top: 18px; bottom: -4px;
    width: 1px; background: var(--line); }
  .tl .it:last-child::after { display: none; }
  .tl .it.ok::before { background: var(--green); }
  .tl .it.err::before { background: var(--red); }
  .tl .it.act::before { background: var(--blue); }
  .tl .r1 { font-size: 12px; color: var(--ink-2); }
  .tl .r2 { margin-top: 2px; font-size: 11px; color: var(--ink-4);
    font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .gap { margin-left: 7px; font-size: 10.5px; color: var(--ink-5); font-family: var(--mono); }

  .jump { display: flex; align-items: center; gap: 9px; padding: 10px 12px; cursor: pointer;
    font-size: 12.5px; color: var(--ink-2); background: var(--panel);
    border: 1px solid var(--line-2); border-radius: 9px; margin-bottom: 6px; transition: .14s; }
  .jump > div { min-width: 0; width: 100%; overflow-wrap: anywhere; }
  .jump .who { white-space: normal; }
  .jump:hover { border-color: var(--accent); color: var(--accent-strong); }
  .jump .ic { flex: none; font-size: 11px; color: var(--ink-4); }
  .jump:hover .ic { color: var(--accent); }

  .note { margin-top: 16px; padding: 11px 13px; border-radius: 9px; font-size: 11.5px;
    line-height: 1.75; color: #74716b; background: var(--panel-2);
    border: 1px solid var(--line-2); }
  .note b { color: var(--ink-2); font-weight: 600; }
  .note.y { background: var(--amber-bg); border-color: var(--amber-bd); color: #8a5a00; }
  .note.y b { color: var(--amber); }

  @media (max-width: 1080px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .side { display: none; }
    input[type=text] { width: 140px; }
  }
</style>
<link rel="stylesheet" href="/trace-assets/trace-explorer.css?v=20260916-viewer-names2">
<script src="/trace-assets/trace-session.js?v=20260916-viewer-names2"></script>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">跨</div>
    <div class="tt">
      <h1>跨端任务追踪</h1>
      <div class="sub" id="scope-hint">加载中…</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="ctrl">
    <div class="seg" id="view-tabs" title="链路：一个任务就是一条链路 —— 发起方开的一件事，以及能顺 parent 溯源回它的全部转派与回推；消息：不分组，一条消息一行">
      <div class="sg on" data-view="links">链路</div>
      <div class="sg" data-view="tasks">消息</div>
    </div>
    <select id="days">
      <option value="1">今天</option>
      <option value="7">近 7 天</option>
      <option value="14">近 14 天</option>
      <option value="30">近 30 天</option>
      <option value="90">近 90 天</option>
      <option value="0" selected>全部历史</option>
      <option value="custom">自定义…</option>
    </select>
    <span id="range-box" style="display:none;align-items:center;gap:6px">
      <input type="date" id="from" />
      <span style="color:var(--ink-5);font-size:12px">—</span>
      <input type="date" id="to" />
    </span>
    <select id="state"></select>
    <input type="text" id="q" placeholder="搜索摘要 / 会话 / 消息ID" />
    <select id="limit" title="每页条数">
      <option value="50">50 条</option>
      <option value="100">100 条</option>
      <option value="200">200 条</option>
      <option value="500" selected>500 条</option>
    </select>
    <div class="live" title="实时事件流"><span class="d" id="live-dot"></span><span id="live-text">连接中</span></div>
  </div>
</header>

<div class="stats">
  <div class="st hero link-st"><div class="k">链路</div><div class="v" id="k-links">-</div></div>
  <div class="st link-st"><div class="k">进行中链路</div><div class="v" id="k-links-active">-</div></div>
  <div class="st"><div class="k">进行中回合</div><div class="v" id="k-active">-</div></div>
  <div class="st"><div class="k">静默告警</div><div class="v" id="k-silent">-</div></div>
  <div class="st"><div class="k">已完成</div><div class="v" id="k-done">-</div></div>
  <div class="st"><div class="k">失败</div><div class="v" id="k-failed">-</div></div>
  <div class="st"><div class="k">单向通知</div><div class="v" id="k-notified">-</div></div>
  <div class="st"><div class="k">在线用户</div><div class="v" id="k-online">-</div></div>
  <div class="st"><div class="k">平均耗时</div><div class="v" id="k-avg">-</div></div>
  <div class="st"><div class="k">P95 耗时</div><div class="v" id="k-p95">-</div></div>
  <div class="stats-sp"></div>
</div>

<main>
  <aside class="side">
    <div class="colhead"><h2>用户</h2><div class="spacer"></div><span class="hint" id="user-count"></span></div>
    <div class="usearch"><input type="text" id="user-q" placeholder="筛选用户" /></div>
    <div class="scroller"><div id="user-list" style="padding:2px 0 16px"></div></div>
  </aside>

  <section class="main-col">
    <div class="colhead">
      <h2 id="task-title">全部链路</h2>
      <div class="spacer"></div>
      <div class="tabs" id="role-tabs">
        <div class="tb on" data-role="all">全部</div>
        <div class="tb" data-role="sent">他发出的</div>
        <div class="tb" data-role="handled">他处理的</div>
      </div>
    </div>
    <div class="scroller" id="task-body">
      <div class="empty"><div class="big">加载中…</div></div>
    </div>
  </section>
</main>

<div class="scrim" id="backdrop"></div>
<aside class="panel" id="drawer">
  <div class="ph">
    <div class="grow">
      <div id="d-title">详情</div>
      <div class="sub" id="d-id"></div>
    </div>
    <button class="xbtn" id="d-close" aria-label="关闭">×</button>
  </div>
  <div class="pb" id="d-body"></div>
</aside>

<script>
(function () {
  'use strict';

  var S = {
    days: 0, from: '', to: '', user: '', role: 'all', state: 'all', q: '', userQ: '',
    kpi: {}, users: [], tasks: [], links: [], edges: [], orphan: 0, groups: [], openChains: {},
    total: 0, limit: 500, offset: 0,
    view: 'links', selected: null, selectedLink: null,
    flash: {}, loading: false, dirty: false, retention: ''
  };

  /* 状态 → 语义色，直接用产品 token 里的浅底 + 描边那一套 */
  var STATE = {
    sent:          { t: '已发出',   v: 'd', run: true  },
    delivered:     { t: '已送达',   v: 'b', run: true  },
    queued:        { t: '排队中',   v: 'y', run: true  },
    working:       { t: '处理中',   v: 'y', run: true  },
    deferred:      { t: '已推迟',   v: 'p', run: false },
    pending_retry: { t: '待重投',   v: 'y', run: true  },
    done:          { t: '已完成',   v: 'g', run: false },
    failed:        { t: '失败',     v: 'r', run: false },
    cancelled:     { t: '已撤回',   v: 'd', run: false },
    notified:      { t: '已通知',   v: 'b', run: false }
  };
  var LINK = {
    active: { t: '进行中', v: 'y', run: true  },
    failed: { t: '有失败', v: 'r', run: false },
    done:   { t: '已完成', v: 'g', run: false }
  };
  var STATE_OPTS = {
    // 链路现在就是任务，筛选口径跟任务一致（命中链上任意节点即保留整条）
    links: [['all', '全部链路'], ['active', '进行中'], ['silent', '已静默'],
            ['done', '已完成'], ['failed', '失败'], ['notified', '单向通知']],
    tasks: [['all', '全部状态'], ['active', '进行中'], ['working', '处理中'], ['queued', '排队中'],
            ['silent', '已静默'], ['done', '已完成'], ['failed', '失败'],
            ['cancelled', '已撤回'], ['notified', '单向通知']]
  };

  // ============================================================ 工具
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function dur(sec) { return window.TraceDuration(sec); }
  // List rendering must not depend on the graph script's version or availability.
  function formatDate(ts, seconds) {
    if (ts == null || ts === '' || !Number.isFinite(Number(ts))) return '未记录';
    var d = new Date(Number(ts) * 1000);
    if (!Number.isFinite(d.getTime())) return '未记录';
    var p = function(n) { return String(n).padStart(2, '0'); };
    return (seconds || d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '年' : '') +
      p(d.getMonth()+1) + '月' + p(d.getDate()) + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes()) +
      (seconds ? ':' + p(d.getSeconds()) : '');
  }
  function hhmm(ts) { return formatDate(ts, false); }
  function full(ts) { return formatDate(ts, true); }
  function ago(ts) { return ts ? dur(Date.now() / 1000 - ts) + '前' : ''; }
  function sm(s) { return STATE[s] || { t: s || '未知', v: 'd', run: false }; }
  function lm(L) {
    if (L.active_turns) return LINK.active;
    if (L.failed_turns) return LINK.failed;
    return LINK.done;
  }
  function sess(s) {
    s = String(s || '');
    if (!s) return '';
    return s.length <= 22 ? s : '…' + s.slice(-7);
  }
  var VCOLOR = {
    g: ['var(--green-bg)', 'var(--green)', 'var(--green-bd)'],
    r: ['var(--red-bg)', 'var(--red)', 'var(--red-bd)'],
    y: ['var(--amber-bg)', 'var(--amber)', 'var(--amber-bd)'],
    b: ['var(--blue-bg)', 'var(--blue)', 'var(--blue-bd)'],
    p: ['var(--purple-bg)', 'var(--purple)', 'var(--purple-bd)'],
    d: ['var(--fill)', 'var(--ink-3)', 'var(--line-2)']
  };
  function pill(m) {
    var c = VCOLOR[m.v] || VCOLOR.d;
    return '<span class="pill' + (m.run ? ' on' : '') + '" style="--pbg:' + c[0] +
      ';--pfg:' + c[1] + ';--pbd:' + c[2] + '"><i></i>' + esc(m.t) + '</span>';
  }
  function bit(cls, text) { return '<span class="bit ' + cls + '">' + esc(text) + '</span>'; }
  /** 参与方：发起方最深，处理方次之，中间一个强调色箭头指示方向 */
  function who(name, session, role, withSess) {
    var ss = withSess && session ? '<span class="ss">' + esc(sess(session)) + '</span>' : '';
    return '<span class="who ' + role + '"' + (session ? ' title="' + esc(session) + '"' : '') + '>' +
      esc(name || '?') + ss + '</span>';
  }
  function api(p) {
    return fetch(p, { headers: { 'Accept': 'application/json' } }).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (b) {
        throw new Error((b.detail && b.detail.message) || ('HTTP ' + r.status));
      });
      return r.json();
    });
  }
  function fillState() {
    var opts = STATE_OPTS[S.view], keep = S.state, ok = false;
    $('state').innerHTML = opts.map(function (o) {
      if (o[0] === keep) ok = true;
      return '<option value="' + o[0] + '">' + o[1] + '</option>';
    }).join('');
    S.state = ok ? keep : 'all';
    $('state').value = S.state;
  }

  // ============================================================ 指标 / 用户
  function renderStats() {
    var k = S.kpi || {};
    function set(id, val, hot, zero, bad) {
      var el = $(id);
      el.textContent = val;
      el.className = 'v' + (hot ? ' hot' : '') + (zero ? ' z' : '') + (bad ? ' bad' : '');
    }
    set('k-active', k.active != null ? k.active : '—', k.active > 0, !k.active);
    set('k-silent', k.silent != null ? k.silent : '—', k.silent > 0, !k.silent);
    set('k-done', k.done != null ? k.done : '—', false, false);
    set('k-failed', k.failed != null ? k.failed : '—', false, !k.failed, k.failed > 0);
    set('k-notified', k.notified != null ? k.notified : '—', false, false);
    set('k-online', k.online_clients != null ? k.online_clients : '—', false, false);
    set('k-avg', k.avg_duration != null ? dur(k.avg_duration) : '—', false, k.avg_duration == null);
    set('k-p95', k.p95_duration != null ? dur(k.p95_duration) : '—', false, k.p95_duration == null);
    $('scope-hint').textContent = (k.tasks_total || 0) + ' 条任务 · ' + rangeText() +
      (S.retention ? ' · 保留' + S.retention : '');
  }
  function renderUsers() {
    var list = S.users.filter(function (u) {
      return !S.userQ || u.client_id.toLowerCase().indexOf(S.userQ.toLowerCase()) >= 0;
    });
    $('user-count').textContent = list.length + ' 人';
    var html = '<div class="user all' + (S.user ? '' : ' on') + '" data-user="">全部用户</div>';
    if (!list.length) {
      html += '<div style="padding:14px 12px;font-size:12px;color:var(--ink-5)">没有匹配的用户</div>';
    }
    list.forEach(function (u) {
      var act = (u.sent_active || 0) + (u.handled_active || 0);
      var bad = (u.sent_failed || 0) + (u.handled_failed || 0);
      var ct = act ? '<span class="ct a">' + act + ' 进行中</span>'
             : (bad ? '<span class="ct b">' + bad + ' 失败</span>' : '');
      html += '<div class="user' + (S.user === u.client_id ? ' on' : '') + '" data-user="' + esc(u.client_id) + '">' +
        (u.online ? '<span class="dot" title="在线"></span>' : '') +
        '<span class="nm">' + esc(u.client_id) + '</span>' + ct +
      '</div>';
    });
    $('user-list').innerHTML = html;
  }

  function ballLine(L, noIndent) {
    var list = L.ball_at || [];
    if (!list.length) return '';
    var parts = list.map(function (b) {
      return '<span class="nm">' + esc(b.client || '?') + '</span> ' + esc(sm(b.state).t) +
        (b.silent ? ' <span class="sl">静默 ' + dur(b.silent_for) + '</span>' : '');
    });
    return '<div class="ball"' + (noIndent ? ' style="margin-top:0"' : '') + '>' +
      '<span class="ic">◆</span><span>当前等待</span>' +
      parts.join('<span class="sep">·</span>') + '</div>';
  }

  // ============================================================ 链路列表
  var groupOpen = new Map(), visibleGroups = [], branchGroups = [], sharedLinks = {}, listGeneration = 0;
  function renderLinks() {
    var box = $('task-body');
    $('task-title').textContent = S.user ? S.user + ' 的链路' : '全部链路';

    if (!S.links.length) {
      box.innerHTML = '<div class="empty"><div class="big">没有符合条件的链路</div>' +
        '<div class="sm">链路按「一对会话」聚合。换个用户、状态或时间范围试试' +
        (S.orphan ? '<br>另有 ' + S.orphan + ' 条任务因缺少会话 ID 无法归入链路，切到「任务」视图可看' : '') +
        '</div></div>';
      return;
    }
    var childCount = {}, parentOf = {};
    (S.edges || []).forEach(function (e) {
      childCount[e.parent_link] = (childCount[e.parent_link] || 0) + 1;
      parentOf[e.child_link] = e.parent_link;
    });
    var pairSeen = {};
    S.links.forEach(function (L) {
      var k = [L.a.client || '?', L.b.client || '?'].sort().join('\u0000');
      pairSeen[k] = (pairSeen[k] || 0) + 1;
    });

    function renderLink(L) {
      var m = lm(L);
      var pk = [L.a.client || '?', L.b.client || '?'].sort().join('\u0000');
      var ws = (L.a.client && L.a.client === L.b.client) || pairSeen[pk] > 1;

      var bits = '';
      if (sharedLinks[L.link_key]>1) bits += bit('p','共享通信 · '+sharedLinks[L.link_key]+' 组');
      if (L.failed_turns) bits += bit('r', L.failed_turns + ' 次通信失败');
      if (L.silent_turns) bits += bit('y', L.silent_turns + ' 次通信长时间无更新');
      if (childCount[L.link_key]) bits += bit('p', '含 ' + childCount[L.link_key] + ' 条下游');
      if (parentOf[L.link_key]) bits += bit('d', '下游链路');
      if (L.via_endpoint) bits += bit('y', '经入口');

      var last = (L.recent_turns && L.recent_turns.length)
        ? L.recent_turns[L.recent_turns.length - 1] : null;
      var line2;
      if (last) {
        var from = last.direction === 'a2b' ? L.a : L.b;
        var to = last.direction === 'a2b' ? L.b : L.a;
        line2 = '<span class="met">' + esc(from.client || '?') + '</span>' +
          '<span class="dir r" style="font-size:12px">→</span>' +
          '<span class="met">' + esc(to.client || '?') + '</span>' +
          '<span class="sum hi grow">' + (esc(last.summary) || '（无摘要）') + '</span>';
      } else {
        line2 = '<span class="none grow">（还没有通信记录）</span>';
      }

      return '<div class="row' + (S.selectedLink === L.link_key ? ' on' : '') + '" data-link="' +
          esc(L.link_key) + '" style="--c:' + (VCOLOR[m.v] || VCOLOR.d)[1] + '">' +
        '<span class="rail"></span>' +
        '<div class="l1">' +
          who(L.a.client, L.a.session, 'a', ws) +
          '<span class="dir">⇄</span>' +
          who(L.b.client, L.b.session, 'b', ws) +
          '<span class="grow"></span>' +
          (bits ? '<span class="bits">' + bits + '</span>' : '') +
          pill(m) +
          '<span class="tp" title="每次请求或通知计一次通信，回复不重复计数"><b>共 ' + L.turns + ' 次通信</b></span>' +
          '<span class="met">最近活动 ' + esc(hhmm(L.last_at)) + '</span>' +
        '</div>' +
        '<div class="link-directions">' +
          esc((L.a.client===L.b.client ? L.a.client+'（左侧会话）' : L.a.client) + ' 发给 ' + (L.a.client===L.b.client ? L.b.client+'（右侧会话）' : L.b.client) + ' ' + L.turns_a_to_b + ' 次') + '；' +
          esc((L.a.client===L.b.client ? L.b.client+'（右侧会话）' : L.b.client) + ' 发给 ' + (L.a.client===L.b.client ? L.a.client+'（左侧会话）' : L.a.client) + ' ' + L.turns_b_to_a + ' 次') +
        '</div><div class="l2">' + line2 + '</div>' +
        ballLine(L) +
      '</div>';
    }
    var html = visibleGroups.map(function(g) {
      var failures=g.links.reduce(function(n,L){return n+(L.failed_turns||0);},0);
      var turns=g.links.reduce(function(n,L){return n+L.turns;},0);
      var names=window.TraceBranches.title(g.tasks);
      var excerpt=(g.tasks.slice().sort(function(a,b){return (b.created_at||0)-(a.created_at||0);})[0].summary||'无摘要').slice(0,90);
      return '<details class="trace-group" data-group="'+esc(g.id)+'"'+(groupOpen.get(g.id)?' open':'')+'><summary><strong>'+esc(names)+'</strong><span>最近活动 '+esc(hhmm(g.lastAt))+' · '+(S.user?'当前会话视角':'发起分支')+' · '+g.links.length+' 个通信入口 · '+turns+' 次通信</span>'+(failures?'<b class="group-failed">失败 '+failures+' 次</b>':'')+'<span class="group-toggle"></span></summary><div class="group-help group-preview">最近消息：'+esc(excerpt)+'</div><div class="group-help">'+g.matched+' 个入口命中筛选；以下为'+(S.user?'当前会话直接上游一层及下游':'完整分支')+'。共享通信会出现在其他组，顶部总计不重复累计。</div><button data-open-branch="'+esc(g.id)+'">查看本组对话图</button><div class="group-rows">'+g.links.map(renderLink).join('')+'</div></details>';

  function timingText(n) {
    if (n.total_seconds != null) return '总耗时 ' + preciseDur(n.total_seconds);

  // ============================================================ 链路详情

  // ============================================================ 任务详情
  /** 把 execution_graph 的节点按 parent_task_id 排成一棵树。
   *  数据来自后端的递归 CTE（祖先 + 后代），这里只负责排版。
   *  只有一个节点时不渲染——孤任务没有“链”可言。 */
  function chainTree(g, currentId) {
    var nodes = (g && g.nodes) || [];
    if (nodes.length < 2) return '';
    var byId = {}, kids = {}, roots = [];
    nodes.forEach(function (n) { byId[n.task_id] = n; kids[n.task_id] = []; });
    nodes.forEach(function (n) {
      var p = n.parent_task_id;
      if (p && byId[p]) kids[p].push(n); else roots.push(n);
    });
    var out = [];
    function walk(n, depth) {
      var m = sm(n.state), c = VCOLOR[m.v] || VCOLOR.d;
      out.push('<div class="crow' + (n.task_id === currentId ? ' cur' : '') +
          '" data-chain="' + esc(n.task_id) + '" style="--c:' + c[1] + ';--d:' + depth + '">' +
        '<span class="cw">' + esc(n.requester || '?') + '<span class="dir">→</span>' +
          esc(n.handler || '?') + '</span>' +
        pill(m) +
        '<span class="csum">' +
          (esc(n.summary) || '<span class="none">（无摘要）</span>') + '</span>' +
      '</div>');
      kids[n.task_id].forEach(function (k) { walk(k, depth + 1); });
    }
    roots.forEach(function (r) { walk(r, 0); });
    return '<div class="chain"><div class="chead">调用链 · 共 ' + nodes.length + ' 个任务' +
      (g.truncated ? '（已截断）' : '') + '，点击可跳转</div>' + out.join('') + '</div>';
  }

  function taskDetail(t) {
    if (t.session_graph && window.TraceSessionExplorer) {
      $('d-title').textContent = '会话通信链路 · ' + t.requester + ' → ' + t.handler;
      $('d-id').textContent = '当前会话直接上游一层＋下游 · ' + t.task_id;
      window.TraceSessionExplorer.mount($('d-body'), t.session_graph, {taskId:t.task_id,viewerClient:S.user});
      // 调用链插在会话图之前：先回答“这次任务经过了谁”，再看会话关系
      var chain = chainTree(t.execution_graph, t.task_id);
      if (chain) $('d-body').insertAdjacentHTML('afterbegin', chain);
      return;
    }
    $('d-body').innerHTML = '<div class="note y">当前服务尚未启用新版执行图。请使用新版服务；不退回丢失上游的旧式跳转。</div>';
    return;
  }

  // ============================================================ 抽屉

  /** 打开一条链路（= 一个任务）的图。
   *
   *  图里只放这个任务自己的节点 —— 用 fixedBranch 让 explorer 跳过按会话扩散的
   *  那套裁剪，否则会把同一对会话在别的任务里的通信也拉进来，
   *  那就又回到了「谁和谁通过信」而不是「这件事怎么跑的」。 */
  function openChain(rootId, focusId) {
    var g = null;
    for (var i = 0; i < S.groups.length; i++) {
      if (S.groups[i].root_id === rootId) { g = S.groups[i]; break; }
    }
    if (!g) return;
    S.selected = focusId || rootId; S.selectedLink = null;
    renderGroups();
    open();
    var root = g.nodes[0] || {};
    // 标题就是「这件事 + 有谁参与」，不再分主副两行。
    // 不画箭头：分叉链路本来是树，强行拉成一条线会变成
    // qirui → qirui2 → qirui → qirui2，看着像在兜圈子，实际并没有。
    var users = [];
    g.nodes.forEach(function (n) {
      [n.requester, n.handler].forEach(function (u) {
        if (u && users.indexOf(u) < 0) users.push(u);
      });
    });
    var usersText = users.length > 5
      ? users.slice(0, 5).join('、') + ' 等 ' + users.length + ' 人'
      : users.join('、');
    $('d-title').innerHTML = '<span class="dsum">' + (esc(root.summary) || esc(rootId)) + '</span>' +
      (usersText ? '<span class="dflow">' + esc(usersText) + '</span>' : '');
    $('d-id').textContent = '';
    if (window.TraceSessionExplorer) {
      window.TraceSessionExplorer.mount($('d-body'), {nodes: g.nodes}, {
        taskId: focusId || rootId,
        fixedBranch: true,
        viewerClient: S.user
      });
    }
  }
  function openTask(id) {

  // ============================================================ 数据

  async function allLinks(params) {

  async function loadLinks() {

    if(generation!==listGeneration||S.view!=='links')return;
    var d=results[0],all=results[1],tasks=results[2].filter(function(t){return !!t.link_key;}),byLink=new Map(all.links.map(function(L){return [L.link_key,L];}));
    branchGroups=window.TraceBranches.forViewer(window.TraceBranches.build(tasks),S.user);sharedLinks={};
    branchGroups.forEach(function(g){
      g.links=g.linkKeys.map(function(k){if(!byLink.has(k))throw Error('分支入口数据不完整，请重试');sharedLinks[k]=(sharedLinks[k]||0)+1;return byLink.get(k);});
      var count=g.links.reduce(function(n,L){return n+L.turns;},0);if(count!==g.tasks.length)throw Error('通信数据正在变化，请刷新重试');
      g.active=g.links.some(function(L){return L.active_turns>0;});g.lastAt=Math.max.apply(null,g.links.map(function(L){return L.last_at||0;}));
      g.links.sort(function(a,b){return Number(b.active_turns>0)-Number(a.active_turns>0)||(b.last_at||0)-(a.last_at||0)||a.link_key.localeCompare(b.link_key);});
    });
    branchGroups.forEach(function(g){g.sharedCounts=Object.fromEntries(g.linkKeys.filter(function(k){return sharedLinks[k]>1;}).map(function(k){return [k,sharedLinks[k]];}));});
    var matched=new Set(d.links.map(function(L){return L.link_key;}));
    var ordered=branchGroups.filter(function(g){g.matched=g.linkKeys.filter(function(k){return matched.has(k);}).length;return g.matched>0;});
    ordered.sort(function(a,b){return Number(b.active)-Number(a.active)||b.lastAt-a.lastAt||a.id.localeCompare(b.id);});
    S.total=ordered.length;if(S.offset>=S.total)S.offset=0;

  }
  function loadList() {
    // 链路 = 任务：走按 parent 溯源分组的接口，不再用按会话对聚合的旧口径
    if (S.view === 'links') return loadGroups();
    return loadTasks();
  }
  function reload() {
    if (S.loading) { S.dirty = true; return; }
    S.loading = true;
    Promise.all([loadStats(), loadList()]).catch(function (e) {
      $('task-body').innerHTML = '<div class="empty"><div class="big">加载失败</div><div class="sm">' + esc(e.message) + '</div></div>';
    }).then(function () {
      S.loading = false;
      if (S.dirty) { S.dirty = false; setTimeout(reload, 200); }
    });
  }
  function switchView(v) {
    if (S.view === v) return;
    S.view = v; S.offset = 0;
    close();
    Array.prototype.forEach.call(document.querySelectorAll('#view-tabs .sg'), function (el) {
      el.classList.toggle('on', el.getAttribute('data-view') === v);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.link-st'), function (el) {
      el.classList.toggle('hide', v !== 'links');
    });
    fillState();
    $('task-body').innerHTML = '<div class="empty"><div class="big">加载中…</div></div>';
    reload();
  }
  var timer = null;
  function schedule(id) {
    if (id) S.flash[id] = true;
    if (timer) return;
    timer = setTimeout(function () { timer = null; reload(); }, 700);
  }
  function live(on, text) {
    $('live-dot').className = 'd' + (on ? ' on' : ' off');
    $('live-text').textContent = text;
  }
  function stream() {
    if (!window.EventSource) { live(false, '轮询'); return; }
    var es = new EventSource('/api/trace/stream');
    es.addEventListener('hello', function (ev) {
      live(true, '实时');
      try {
        var d = JSON.parse(ev.data);
        S.retention = d.retention === 'forever' ? '永久' : (d.retention || '');
        renderStats();
      } catch (e) { /* 非关键 */ }
    });
    es.addEventListener('task', function (ev) {
      try { schedule((JSON.parse(ev.data).task || {}).task_id); } catch (e) { schedule(); }
    });
    es.onopen = function () { live(true, '实时'); };
    es.onerror = function () { live(false, '重连中'); };
  }

  // ============================================================ 事件
  $('days').addEventListener('change', function () {
    if (this.value === 'custom') {
      S.days = 'custom';
      $('range-box').style.display = 'inline-flex';
      if (!S.from && !S.to) return;
    } else {
      S.days = parseInt(this.value, 10);
      $('range-box').style.display = 'none';
    }
    S.offset = 0; reload();
  });
  $('from').addEventListener('change', function () { S.from = this.value; S.offset = 0; reload(); });
  $('to').addEventListener('change', function () { S.to = this.value; S.offset = 0; reload(); });
  $('limit').addEventListener('change', function () { S.limit = parseInt(this.value, 10); S.offset = 0; loadList(); });
  $('state').addEventListener('change', function () { S.state = this.value; S.offset = 0; loadList(); });
  var qt = null;
  $('q').addEventListener('input', function () {
    var v = this.value;
    clearTimeout(qt);
    qt = setTimeout(function () { S.q = v; S.offset = 0; loadList(); }, 260);
  });
  $('user-q').addEventListener('input', function () { S.userQ = this.value; renderUsers(); });
  $('user-list').addEventListener('click', function (e) {
    var el = e.target.closest('[data-user]');
    if (!el) return;
    S.user = el.getAttribute('data-user');
    S.offset = 0;
    if (!S.user) S.role = 'all';
    Array.prototype.forEach.call(document.querySelectorAll('#role-tabs .tb'), function (t) {
      t.classList.toggle('on', t.getAttribute('data-role') === S.role);
    });
    renderUsers(); loadList();
  });
  $('view-tabs').addEventListener('click', function (e) {
    var el = e.target.closest('[data-view]');
    if (el) switchView(el.getAttribute('data-view'));
  });
  $('role-tabs').addEventListener('click', function (e) {
    var el = e.target.closest('[data-role]');
    if (!el) return;
    S.role = el.getAttribute('data-role');
    S.offset = 0;
    Array.prototype.forEach.call(document.querySelectorAll('#role-tabs .tb'), function (t) { t.classList.remove('on'); });
    el.classList.add('on');
    loadList();
  });
  $('task-body').addEventListener('toggle',function(e){if(e.target.matches('details[data-group]'))groupOpen.set(e.target.dataset.group,e.target.open);},true);
  $('task-body').addEventListener('click', function (e) {
    if (e.target.id === 'pg-prev') { S.offset = Math.max(0, S.offset - pageSize()); loadList(); return; }
    if (e.target.id === 'pg-next') { S.offset += pageSize(); loadList(); return; }
    var lk = e.target.closest('[data-link]');
    var chainMap = e.target.closest('[data-chain-root]');
    if (chainMap) { openChain(chainMap.getAttribute('data-chain-root')); return; }
    var tog = e.target.closest('[data-chain-toggle]');
    if (tog) {
      var rid = tog.getAttribute('data-chain-toggle');
      S.openChains[rid] = !S.openChains[rid];
      renderGroups();
      return;
    }
    var branch=e.target.closest('[data-open-branch]');if(branch){openBranch(branch.dataset.openBranch);return;}
    if (lk) { var group=lk.closest('[data-group]');if(group)openBranch(group.dataset.group,lk.dataset.link);else openLink(lk.dataset.link);return; }
    var tk = e.target.closest('[data-id]');
    if (tk) {
      var id = tk.getAttribute('data-id');
      // 链路视图里点具体环节，也该看到「这件事怎么跑的」——
      // 走 openTask 会拉出按会话扩散的全量图，把别的任务的通信也混进来。
      if (S.view === 'links') {
        var owner = null;
        for (var gi = 0; gi < S.groups.length; gi++) {
          for (var ni = 0; ni < S.groups[gi].nodes.length; ni++) {
            if (S.groups[gi].nodes[ni].task_id === id) { owner = S.groups[gi].root_id; break; }
          }
          if (owner) break;
        }
        if (owner) { openChain(owner, id); return; }
      }
      openTask(id);
    }
  });
  $('d-close').addEventListener('click', close);
  // 调用链行点击：在同一个抽屉里跳到另一个任务，不关闭抽屉
  $('d-body').addEventListener('click', function (e) {
    var c = e.target.closest('[data-chain]');
    if (c) openTask(c.getAttribute('data-chain'));
  });
  $('backdrop').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  // ============================================================ 启动
  fillState();
  reload();
  stream();
  setInterval(function () {
    if (document.hidden) return;
    var now = Date.now() / 1000;
    Array.prototype.forEach.call(document.querySelectorAll('.dur[data-since]'), function (el) {
      var since = parseFloat(el.getAttribute('data-since'));
      if (since) el.textContent = dur(now - since);
    });
  }, 1000);
  setInterval(function () { if (!document.hidden) reload(); }, 10000);
})();
</script>
</body>
</html>
