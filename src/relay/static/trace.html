<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>跨端任务追踪 · YAgent Relay</title>
<style>
  :root {
    --bg: #0b0f16;
    --bg-soft: #111823;
    --panel: #151d2a;
    --panel-2: #1a2431;
    --line: #23303f;
    --line-soft: #1c2735;
    --text: #e5edf7;
    --text-dim: #8fa3b8;
    --text-faint: #5f7286;
    --accent: #4c9ffe;
    --accent-soft: rgba(76, 159, 254, .14);
    --green: #3ecf8e;
    --yellow: #e3b341;
    --red: #ff6b62;
    --purple: #b183f5;
    --orange: #f0883e;
    --cyan: #4dd4d4;
    --radius: 12px;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 15% -10%, #16233a 0%, var(--bg) 55%) fixed;
    color: var(--text);
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; flex-direction: column;
  }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #263445; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: #33465c; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 顶栏 ---------- */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px; border-bottom: 1px solid var(--line-soft);
    background: rgba(11, 15, 22, .72); backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: .3px; font-weight: 600; }
  .brand span { color: var(--text-faint); font-size: 12px; }
  .spacer { flex: 1; }
  .ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  select, input[type=text], input[type=date] {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; font: inherit; font-size: 13px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  select:focus, input[type=text]:focus, input[type=date]:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  input[type=date] { color-scheme: dark; }
  input[type=text] { width: 210px; }
  .live {
    display: flex; align-items: center; gap: 7px; font-size: 12px;
    color: var(--text-dim); padding: 6px 11px;
    border: 1px solid var(--line); border-radius: 20px; background: var(--panel);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(62, 207, 142, .18); animation: pulse 2.4s infinite; }
  .dot.err { background: var(--red); }
  @keyframes pulse { 50% { opacity: .45; } }

  /* ---------- KPI ---------- */
  .kpis { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px; padding: 16px 22px 4px; }
  .kpi {
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-soft) 100%);
    border: 1px solid var(--line-soft); border-radius: var(--radius);
    padding: 12px 14px; position: relative; overflow: hidden;
  }
  .kpi::after { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--accent); opacity: .5; }
  .kpi.g::after { background: var(--green); } .kpi.y::after { background: var(--yellow); }
  .kpi.r::after { background: var(--red); }   .kpi.c::after { background: var(--cyan); }
  .kpi.p::after { background: var(--purple); }
  .kpi .k { color: var(--text-faint); font-size: 11.5px; letter-spacing: .4px; }
  .kpi .v { font-size: 22px; font-weight: 650; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .kpi .u { font-size: 12px; color: var(--text-faint); margin-left: 3px; font-weight: 400; }

  /* ---------- 主体 ---------- */
  main { flex: 1; display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 14px; padding: 14px 22px 22px; min-height: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line-soft); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel > .head { padding: 12px 14px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 8px; }
  .panel > .head h2 { font-size: 13px; margin: 0; font-weight: 600; color: var(--text-dim); letter-spacing: .5px; }
  .panel > .body { overflow: auto; flex: 1; min-height: 0; }

  /* 用户栏 */
  .user-search { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); }
  .user-search input { width: 100%; }
  .user {
    display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 9px;
    padding: 9px 13px; cursor: pointer; border-left: 2px solid transparent;
    transition: background .12s;
  }
  .user:hover { background: var(--panel-2); }
  .user.sel { background: var(--accent-soft); border-left-color: var(--accent); }
  .user .nm { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user .sub { color: var(--text-faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .badge {
    min-width: 20px; text-align: center; font-size: 11px; padding: 1px 7px; border-radius: 10px;
    background: #22303f; color: var(--text-dim); font-variant-numeric: tabular-nums;
  }
  .badge.hot { background: rgba(76, 159, 254, .2); color: #8cc4ff; }
  .all-users { padding: 9px 13px; cursor: pointer; color: var(--text-dim); border-bottom: 1px solid var(--line-soft); }
  .all-users:hover { background: var(--panel-2); }
  .all-users.sel { background: var(--accent-soft); color: var(--text); }

  /* 任务区 */
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 12.5px;
    color: var(--text-dim); border: 1px solid transparent;
  }
  .tab:hover { background: var(--panel-2); }
  .tab.on { background: var(--accent-soft); color: #a9d1ff; border-color: rgba(76, 159, 254, .35); }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; background: var(--bg-soft); z-index: 2;
    text-align: left; font-size: 11.5px; font-weight: 600; color: var(--text-faint);
    letter-spacing: .5px; padding: 9px 12px; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tbody tr { cursor: pointer; transition: background .12s; }
  tbody tr:hover { background: var(--panel-2); }
  tbody tr.sel { background: var(--accent-soft); }
  tbody tr.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: rgba(76, 159, 254, .3); } to { background: transparent; } }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 12px; padding: 3px 9px; border-radius: 20px;
    border: 1px solid currentColor; background: rgba(255, 255, 255, .03);
  }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.spin i { animation: pulse 1.5s infinite; }
  .peer { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .peer b { font-weight: 550; }
  .peer .arrow { color: var(--text-faint); }
  .sess { color: var(--text-faint); font-size: 11px; font-family: ui-monospace, Consolas, monospace; }
  .sum { color: var(--text-dim); max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { height: 4px; border-radius: 3px; background: #22303f; overflow: hidden; margin-top: 5px; width: 92px; }
  .bar > div { height: 100%; border-radius: 3px; }
  .empty { padding: 46px 20px; text-align: center; color: var(--text-faint); }
  .empty .big { font-size: 15px; color: var(--text-dim); margin-bottom: 6px; }
  .pager {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 14px; color: var(--text-dim); font-size: 12.5px;
    border-top: 1px solid var(--line-soft);
  }
  .pager button {
    background: var(--panel-2); color: var(--text-dim); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 12px; cursor: pointer; font: inherit; font-size: 12.5px;
  }
  .pager button:hover:not([disabled]) { color: var(--text); border-color: var(--accent); }
  .pager button[disabled] { opacity: .4; cursor: not-allowed; }

  /* 抽屉 */
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 520px; max-width: 94vw;
    background: var(--bg-soft); border-left: 1px solid var(--line);
    box-shadow: var(--shadow); z-index: 40; display: flex; flex-direction: column;
    transform: translateX(102%); transition: transform .22s cubic-bezier(.4, 0, .2, 1);
  }
  .drawer.open { transform: none; }
  .drawer .dhead { padding: 15px 18px; border-bottom: 1px solid var(--line-soft); }
  .drawer .dbody { flex: 1; overflow: auto; padding: 16px 18px 30px; }
  .close {
    background: none; border: 1px solid var(--line); color: var(--text-dim);
    width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1;
  }
  .close:hover { color: var(--text); border-color: var(--accent); }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 7px 12px; font-size: 13px; }
  .kv dt { color: var(--text-faint); }
  .kv dd { margin: 0; word-break: break-all; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .metric { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 12px; }
  .metric .k { color: var(--text-faint); font-size: 11px; }
  .metric .v { font-size: 17px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .sect { font-size: 12px; color: var(--text-faint); letter-spacing: .5px; margin: 18px 0 10px; text-transform: uppercase; }
  .tl { position: relative; padding-left: 22px; }
  .tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
  .tl .it { position: relative; padding: 8px 0 12px; }
  .tl .it::before {
    content: ""; position: absolute; left: -21px; top: 13px; width: 9px; height: 9px;
    border-radius: 50%; background: var(--panel); border: 2px solid var(--text-faint);
  }
  .tl .it.ok::before { border-color: var(--green); }
  .tl .it.err::before { border-color: var(--red); }
  .tl .it.act::before { border-color: var(--accent); }
  .tl .it.dim::before { border-color: #33465c; }
  .tl .t { font-size: 13px; }
  .tl .m { color: var(--text-faint); font-size: 11.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .gap { color: var(--text-faint); font-size: 11px; margin-left: 8px; }
  .note {
    margin-top: 16px; padding: 10px 12px; border-radius: 9px; font-size: 12px;
    background: rgba(227, 179, 65, .09); border: 1px solid rgba(227, 179, 65, .28); color: #e6c66f;
  }
  .backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 35; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .backdrop.on { opacity: 1; pointer-events: auto; }
  @media (max-width: 1180px) {
    .kpis { grid-template-columns: repeat(4, 1fr); }
    main { grid-template-columns: 220px minmax(0, 1fr); }
    .sum { max-width: 220px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>跨端任务追踪</h1>
    <span id="scope-hint">Relay 全局视图</span>
  </div>
  <div class="spacer"></div>
  <div class="ctrl">
    <select id="days">
      <option value="1">今天</option>
      <option value="7">近 7 天</option>
      <option value="14" selected>近 14 天</option>
      <option value="30">近 30 天</option>
      <option value="90">近 90 天</option>
      <option value="0">全部历史</option>
      <option value="custom">自定义…</option>
    </select>
    <span id="range-box" style="display:none;align-items:center;gap:6px">
      <input type="date" id="from" />
      <span style="color:var(--text-faint)">至</span>
      <input type="date" id="to" />
    </span>
    <select id="state">
      <option value="all">全部状态</option>
      <option value="active">进行中</option>
      <option value="working">处理中</option>
      <option value="queued">排队中</option>
      <option value="silent">已静默</option>
      <option value="done">已完成</option>
      <option value="failed">失败</option>
      <option value="cancelled">已撤回</option>
      <option value="notified">单向通知</option>
    </select>
    <input type="text" id="q" placeholder="搜索摘要 / 会话ID / msg_id" />
    <select id="limit" title="每页条数">
      <option value="50">50 条/页</option>
      <option value="100" selected>100 条/页</option>
      <option value="200">200 条/页</option>
      <option value="500">500 条/页</option>
    </select>
    <div class="live"><span class="dot" id="live-dot"></span><span id="live-text">连接中</span></div>
  </div>
</header>

<div class="kpis">
  <div class="kpi c"><div class="k">在线用户</div><div class="v" id="k-online">-</div></div>
  <div class="kpi"><div class="k">进行中</div><div class="v" id="k-active">-</div></div>
  <div class="kpi y"><div class="k">静默告警</div><div class="v" id="k-silent">-</div></div>
  <div class="kpi g"><div class="k">已完成</div><div class="v" id="k-done">-</div></div>
  <div class="kpi r"><div class="k">失败</div><div class="v" id="k-failed">-</div></div>
  <div class="kpi c"><div class="k">单向通知</div><div class="v" id="k-notified">-</div></div>
  <div class="kpi p"><div class="k">平均耗时</div><div class="v" id="k-avg">-</div></div>
  <div class="kpi p"><div class="k">P95 耗时</div><div class="v" id="k-p95">-</div></div>
</div>

<main>
  <section class="panel">
    <div class="head"><h2>用户</h2><div class="spacer"></div><span class="sub" id="user-count"></span></div>
    <div class="user-search"><input type="text" id="user-q" placeholder="按用户名筛选" /></div>
    <div class="body" id="user-list"></div>
  </section>

  <section class="panel">
    <div class="head">
      <h2 id="task-title">全部任务</h2>
      <div class="spacer"></div>
      <div class="tabs" id="role-tabs">
        <div class="tab on" data-role="all">全部</div>
        <div class="tab" data-role="sent">他发出的</div>
        <div class="tab" data-role="handled">他处理的</div>
      </div>
    </div>
    <div class="body" id="task-body">
      <div class="empty"><div class="big">加载中…</div></div>
    </div>
  </section>
</main>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="dhead" style="display:flex;align-items:center;gap:10px">
    <div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:600" id="d-title">任务详情</div>
      <div class="mono" style="color:var(--text-faint);margin-top:3px" id="d-id"></div>
    </div>
    <button class="close" id="d-close">×</button>
  </div>
  <div class="dbody" id="d-body"></div>
</aside>

<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- 状态
  var S = {
    days: 14, from: '', to: '', user: '', role: 'all', state: 'all', q: '', userQ: '',
    kpi: {}, users: [], tasks: [], total: 0, limit: 100, offset: 0,
    selected: null, flash: {}, loading: false, dirty: false, retention: ''
  };

  var STATE_META = {
    sent:          { label: '已发出',   color: 'var(--text-dim)', spin: false },
    delivered:     { label: '已送达',   color: 'var(--cyan)',     spin: true  },
    queued:        { label: '排队中',   color: 'var(--yellow)',   spin: true  },
    working:       { label: '处理中',   color: 'var(--accent)',   spin: true  },
    deferred:      { label: '已推迟',   color: 'var(--purple)',   spin: false },
    pending_retry: { label: '待重投',   color: 'var(--orange)',   spin: true  },
    done:          { label: '已完成',   color: 'var(--green)',    spin: false },
    failed:        { label: '失败',     color: 'var(--red)',      spin: false },
    cancelled:     { label: '已撤回',   color: 'var(--text-faint)', spin: false },
    notified:      { label: '已通知',   color: 'var(--cyan)',     spin: false }
  };

  var EV_META = {
    request:   { label: '发起任务',     cls: 'act' },
    notify:    { label: '单向通知',     cls: 'act' },
    probe:     { label: '状态对账探针', cls: 'dim' },
    heartbeat: { label: '状态对账',     cls: 'dim' },
    probe_ack: { label: '对端状态',     cls: 'act' },
    response:  { label: '收到结果',     cls: 'ok'  },
    error:     { label: '出错',         cls: 'err' },
    cancel:    { label: '发起方撤回',   cls: 'dim' },
    truncated: { label: '（中间事件已省略）', cls: 'dim' }
  };

  var PEER_STATE_CN = {
    working: '正在处理', queued: '排队等待', deferred: '已推迟',
    pending_retry: '等待重投', unknown: '对端不认识该请求'
  };

  // ---------------------------------------------------------------- 工具
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function dur(sec) {
    if (sec == null) return '-';
    sec = Math.max(0, Math.round(sec));
    if (sec < 60) return sec + 's';
    var m = Math.floor(sec / 60), s = sec % 60;
    if (m < 60) return m + 'm' + (s ? s + 's' : '');
    var h = Math.floor(m / 60); m = m % 60;
    if (h < 24) return h + 'h' + (m ? m + 'm' : '');
    return Math.floor(h / 24) + 'd' + (h % 24) + 'h';
  }
  function clock(ts) {
    if (!ts) return '-';
    var d = new Date(ts * 1000), p = function (n) { return n < 10 ? '0' + n : '' + n; };
    var today = new Date();
    var sameDay = d.toDateString() === today.toDateString();
    var hhmmss = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    return sameDay ? hhmmss : (p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + hhmmss);
  }
  function ago(ts) {
    if (!ts) return '';
    return dur(Date.now() / 1000 - ts) + '前';
  }
  function bytes(n) {
    if (!n) return '0';
    if (n < 1024) return n + 'B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'KB';
    return (n / 1024 / 1024).toFixed(2) + 'MB';
  }
  function shortId(s) {
    s = String(s || '');
    return s.length > 16 ? s.slice(0, 10) + '…' + s.slice(-4) : s;
  }
  function meta(state) { return STATE_META[state] || { label: state || '未知', color: 'var(--text-dim)', spin: false }; }

  function api(path) {
    return fetch(path, { headers: { 'Accept': 'application/json' } }).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (b) {
        throw new Error((b.detail && b.detail.message) || ('HTTP ' + r.status));
      });
      return r.json();
    });
  }

  // ---------------------------------------------------------------- 渲染：KPI
  function renderKpi() {
    var k = S.kpi || {};
    $('k-online').textContent = k.online_clients != null ? k.online_clients : '-';
    $('k-active').textContent = k.active != null ? k.active : '-';
    $('k-silent').textContent = k.silent != null ? k.silent : '-';
    $('k-done').textContent = k.done != null ? k.done : '-';
    $('k-failed').textContent = k.failed != null ? k.failed : '-';
    $('k-notified').textContent = k.notified != null ? k.notified : '-';
    $('k-avg').innerHTML = k.avg_duration != null ? esc(dur(k.avg_duration)) : '<span class="u">暂无</span>';
    $('k-p95').innerHTML = k.p95_duration != null ? esc(dur(k.p95_duration)) : '<span class="u">暂无</span>';
    $('scope-hint').textContent = '共 ' + (k.tasks_total || 0) + ' 条任务 · ' + rangeLabel() +
      (S.retention ? ' · 保留' + S.retention : '');
  }

  // ---------------------------------------------------------------- 渲染：用户栏
  function renderUsers() {
    var box = $('user-list');
    var list = S.users.filter(function (u) {
      return !S.userQ || u.client_id.toLowerCase().indexOf(S.userQ.toLowerCase()) >= 0;
    });
    $('user-count').textContent = list.length + ' 人';

    var html = '<div class="all-users' + (S.user ? '' : ' sel') + '" data-user="">全部用户</div>';
    if (!list.length) {
      html += '<div class="empty">没有匹配的用户</div>';
    }
    list.forEach(function (u) {
      var act = (u.sent_active || 0) + (u.handled_active || 0);
      var color = u.online ? 'var(--green)' : 'var(--text-faint)';
      html += '<div class="user' + (S.user === u.client_id ? ' sel' : '') + '" data-user="' + esc(u.client_id) + '">' +
        '<span class="dot' + (u.online ? ' on' : '') + '" style="background:' + color + '"></span>' +
        '<div style="min-width:0">' +
          '<div class="nm">' + esc(u.client_id) + '</div>' +
          '<div class="sub">发起 ' + (u.sent_total || 0) + ' · 处理 ' + (u.handled_total || 0) +
            (u.sent_failed + u.handled_failed ? ' · <span style="color:var(--red)">失败 ' + (u.sent_failed + u.handled_failed) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<span class="badge' + (act ? ' hot' : '') + '">' + (act || '·') + '</span>' +
      '</div>';
    });
    box.innerHTML = html;
  }

  // ---------------------------------------------------------------- 渲染：任务表
  function progressBar(t) {
    var m = meta(t.state);
    var pct;
    if (t.terminal) pct = 100;
    else if (t.state === 'working') pct = 66;
    else if (t.state === 'queued' || t.state === 'pending_retry' || t.state === 'deferred') pct = 33;
    else pct = 15;
    return '<div class="bar"><div style="width:' + pct + '%;background:' + m.color + '"></div></div>';
  }

  function renderTasks() {
    var box = $('task-body');
    $('task-title').textContent = S.user
      ? (S.user + ' · ' + (S.role === 'sent' ? '他发出的任务' : S.role === 'handled' ? '他处理的任务' : '相关任务'))
      : '全部任务';

    if (!S.tasks.length) {
      box.innerHTML = '<div class="empty"><div class="big">没有符合条件的任务</div>' +
        '<div>换个用户、状态或时间范围试试；数据长期保留，选“全部历史”可查到最早一条</div></div>';
      return;
    }

    var rows = S.tasks.map(function (t) {
      var m = meta(t.state);
      var chip = '<span class="chip' + (m.spin ? ' spin' : '') + '" style="color:' + m.color + '"><i></i>' + esc(m.label) +
        (t.silent ? ' ⚠' : '') + '</span>';
      var err = t.error_code ? '<div class="sub" style="color:var(--red);font-size:11px">' + esc(t.error_code) + '</div>' : '';
      var live = t.terminal ? '' :
        '<div class="sub" style="color:var(--text-faint);font-size:11px">更新 ' + ago(t.state_at) + '</div>';
      return '<tr data-id="' + esc(t.task_id) + '" class="' + (S.selected === t.task_id ? 'sel ' : '') + (S.flash[t.task_id] ? 'flash' : '') + '">' +
        '<td>' + chip + err + '</td>' +
        '<td><div class="peer"><b>' + esc(t.requester || '?') + '</b><span class="arrow">→</span><b>' + esc(t.handler || '?') + '</b>' +
          (t.kind === 'notify' ? '<span class="badge">通知</span>' : '') + '</div>' +
          '<div class="sess">' + esc(shortId(t.handler_session)) + '</div></td>' +
        '<td><div class="sum">' + (esc(t.summary) || '<span style="color:var(--text-faint)">（无正文摘要）</span>') + '</div>' +
          progressBar(t) + '</td>' +
        '<td class="num dur"' + (t.terminal ? '' : ' data-since="' + (t.created_at || 0) + '"') + '>' +
          '<span class="dv">' + esc(dur(t.duration)) + '</span>' + live + '</td>' +
        '<td class="num" style="color:var(--text-dim)">' + esc(clock(t.created_at)) +
          '<div class="sub" style="font-size:11px;color:var(--text-faint)">' + esc(ago(t.created_at)) + '</div></td>' +
      '</tr>';
    }).join('');

    box.innerHTML = '<table><thead><tr>' +
      '<th style="width:120px">状态</th><th style="width:190px">发起 → 处理</th><th>任务摘要</th>' +
      '<th style="width:96px">耗时</th><th style="width:120px">发起时间</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' + pager();
    S.flash = {};
  }

  function pager() {
    if (S.total <= S.limit) return '';
    var from = S.offset + 1, to = Math.min(S.offset + S.limit, S.total);
    var prevDisabled = S.offset <= 0 ? ' disabled' : '';
    var nextDisabled = to >= S.total ? ' disabled' : '';
    return '<div class="pager">' +
      '<button id="pg-prev"' + prevDisabled + '>上一页</button>' +
      '<span>' + from + ' - ' + to + ' / 共 ' + S.total + ' 条</span>' +
      '<button id="pg-next"' + nextDisabled + '>下一页</button>' +
      '</div>';
  }

  // ---------------------------------------------------------------- 渲染：详情抽屉
  function renderDetail(t) {
    var m = meta(t.state);
    var html = '<dl class="kv">' +
      '<dt>状态</dt><dd><span class="chip" style="color:' + m.color + '"><i></i>' + esc(m.label) + '</span>' +
        (t.silent ? ' <span style="color:var(--yellow);font-size:12px">⚠ 超过 3 分钟没有任何帧</span>' : '') + '</dd>' +
      '<dt>发起方</dt><dd>' + esc(t.requester || '-') + ' <span class="mono" style="color:var(--text-faint)">' + esc(t.requester_session || '') + '</span></dd>' +
      '<dt>处理方</dt><dd>' + esc(t.handler || '-') + ' <span class="mono" style="color:var(--text-faint)">' + esc(t.handler_session || '') + '</span></dd>' +
      '<dt>会话链路</dt><dd class="mono">' + esc(t.conv_id || '-') + (t.hop > 1 ? ' · 第 ' + t.hop + ' 跳' : '') + '</dd>' +
      '<dt>发起时间</dt><dd>' + esc(clock(t.created_at)) + ' <span style="color:var(--text-faint)">' + esc(ago(t.created_at)) + '</span></dd>' +
      '<dt>结束时间</dt><dd>' + (t.finished_at ? esc(clock(t.finished_at)) : '<span style="color:var(--text-faint)">未结束</span>') + '</dd>' +
      (t.error_code ? '<dt>错误</dt><dd style="color:var(--red)">' + esc(t.error_code) + ' ' + esc(t.error_message || '') + '</dd>' : '') +
      '<dt>任务摘要</dt><dd>' + (esc(t.summary) || '<span style="color:var(--text-faint)">（无正文摘要）</span>') + '</dd>' +
    '</dl>';

    html += '<div class="metrics">' +
      '<div class="metric"><div class="k">总耗时</div><div class="v">' + esc(dur(t.duration)) + '</div></div>' +
      '<div class="metric"><div class="k">等待（≈）</div><div class="v">' + esc(dur(t.wait_seconds)) + '</div></div>' +
      '<div class="metric"><div class="k">处理（≈）</div><div class="v">' + esc(dur(t.work_seconds)) + '</div></div>' +
      '<div class="metric"><div class="k">对账探针</div><div class="v">' + (t.probe_count || 0) + '<span class="u">轮</span></div></div>' +
      '<div class="metric"><div class="k">对端回应</div><div class="v">' + (t.probe_ack_count || 0) + '<span class="u">次</span></div></div>' +
      '<div class="metric"><div class="k">往返数据</div><div class="v" style="font-size:14px">' + bytes(t.bytes_out) + ' / ' + bytes(t.bytes_in) + '</div></div>' +
    '</div>';

    html += '<div class="sect">链路时间线</div><div class="tl">';
    var tl = t.timeline || [], prev = null;
    if (!tl.length) html += '<div class="it dim"><div class="t">暂无事件</div></div>';
    tl.forEach(function (e) {
      var em = EV_META[e.ev] || { label: e.ev, cls: 'dim' };
      var cls = em.cls;
      if (e.error_code) cls = 'err';
      var title = em.label;
      if (e.ev === 'probe_ack' || e.ev === 'heartbeat') {
        var st = PEER_STATE_CN[e.peer_state] || e.peer_state || '';
        title = st ? '对端状态：' + st : '状态对账（对端未回应）';
        if (e.peer_state === 'unknown') cls = 'err';
        else if (e.peer_state) cls = 'act';
      }
      if (e.ev === 'request' || e.ev === 'notify') {
        title += e.delivered > 0 ? '（Relay 已投递 ' + e.delivered + ' 条连接）' : '（未投递）';
      }
      if (e.error_code) title += ' · ' + e.error_code;
      var gap = prev != null ? '<span class="gap">+' + dur(e.ts - prev) + '</span>' : '';
      var extra = [];
      if (e.ev === 'heartbeat') {
        extra.push('对账 ' + (e.probe_count || 0) + ' 轮 / 回应 ' + (e.ack_count || 0) + ' 次');
        if (e.last_ts && e.last_ts !== e.ts) extra.push('持续至 ' + clock(e.last_ts));
      } else if (e.count > 1) {
        extra.push('×' + e.count + '（至 ' + clock(e.last_ts) + '）');
      }
      if (e.bytes) extra.push(bytes(e.bytes));
      if (e.error_message) extra.push(e.error_message);
      if (e.origin === 'rest') extra.push('来自 REST');
      html += '<div class="it ' + cls + '">' +
        '<div class="t">' + esc(title) + gap + '</div>' +
        '<div class="m">' + esc(clock(e.ts)) + (extra.length ? ' · ' + esc(extra.join(' · ')) : '') + '</div>' +
      '</div>';
      prev = e.last_ts || e.ts;
    });
    html += '</div>';

    html += '<div class="note">时间精度说明：发起、投递、完成时间与总耗时是精确值；' +
      '「开始处理 / 等待 / 处理」由每 60 秒一轮的状态对账推算，误差可达 ±60 秒。' +
      '中心服只能观测跨端边界上的消息，看不到对端 agent 内部的执行步骤。</div>';

    if (t.partial) {
      html += '<div class="note">这条任务没有采集到发起帧（追踪启动前就已发出，或超出保留期），' +
        '发起方信息可能不完整。</div>';
    }

    $('d-title').textContent = (t.requester || '?') + ' → ' + (t.handler || '?');
    $('d-id').textContent = t.task_id;
    $('d-body').innerHTML = html;
  }

  function openDrawer(taskId) {
    S.selected = taskId;
    renderTasks();
    $('drawer').classList.add('open');
    $('backdrop').classList.add('on');
    $('d-body').innerHTML = '<div class="empty">加载中…</div>';
    api('/api/trace/tasks/' + encodeURIComponent(taskId)).then(function (data) {
      if (S.selected === taskId) renderDetail(data.task);
    }).catch(function (err) {
      $('d-body').innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
    });
  }
  function closeDrawer() {
    S.selected = null;
    $('drawer').classList.remove('open');
    $('backdrop').classList.remove('on');
    renderTasks();
  }

  // ---------------------------------------------------------------- 拉取
  function rangeParams() {
    if (S.days === 'custom') {
      var qs = '';
      if (S.from) qs += '&from=' + encodeURIComponent(S.from);
      if (S.to) qs += '&to=' + encodeURIComponent(S.to + ' 23:59:59');
      return qs || '&days=0';
    }
    return '&days=' + S.days;
  }

  function rangeLabel() {
    if (S.days === 'custom') return (S.from || '最早') + ' 至 ' + (S.to || '今天');
    if (S.days === 0 || S.days === '0') return '全部历史';
    if (Number(S.days) === 1) return '今天';
    return '近 ' + S.days + ' 天';
  }

  function loadOverview() {
    return api('/api/trace/overview?_=1' + rangeParams()).then(function (data) {
      S.kpi = data.kpi; S.users = data.users || [];
      renderKpi(); renderUsers();
    });
  }
  function loadTasks() {
    var qs = '?limit=' + S.limit + '&offset=' + S.offset + rangeParams() +
      '&role=' + S.role + '&state=' + encodeURIComponent(S.state) +
      '&user=' + encodeURIComponent(S.user) + '&q=' + encodeURIComponent(S.q);
    return api('/api/trace/tasks' + qs).then(function (data) {
      S.tasks = data.tasks || []; S.total = data.total || 0;
      renderTasks();
    });
  }
  function reload() {
    if (S.loading) { S.dirty = true; return; }
    S.loading = true;
    Promise.all([loadOverview(), loadTasks()]).catch(function (err) {
      $('task-body').innerHTML = '<div class="empty"><div class="big">加载失败</div><div>' + esc(err.message) + '</div></div>';
    }).then(function () {
      S.loading = false;
      if (S.dirty) { S.dirty = false; setTimeout(reload, 200); }
    });
  }

  // 节流：SSE 可能一秒来好几条，合并成一次刷新
  var pending = null;
  function scheduleReload(taskId) {
    if (taskId) S.flash[taskId] = true;
    if (pending) return;
    pending = setTimeout(function () { pending = null; reload(); }, 700);
  }

  // ---------------------------------------------------------------- SSE
  function connectStream() {
    if (!window.EventSource) { setLive(false, '浏览器不支持 SSE，改为轮询'); return; }
    var es = new EventSource('/api/trace/stream');
    es.addEventListener('hello', function (ev) {
      setLive(true, '实时');
      try {
        var info = JSON.parse(ev.data);
        S.retention = info.retention === 'forever' ? '永久' : (info.retention || '');
        renderKpi();
      } catch (e) { /* 无关紧要 */ }
    });
    es.addEventListener('task', function (ev) {
      try {
        var data = JSON.parse(ev.data);
        scheduleReload(data.task && data.task.task_id);
      } catch (e) { scheduleReload(); }
    });
    es.onerror = function () {
      setLive(false, '连接中断，重试中');
      // EventSource 自带重连，这里只更新指示灯
    };
    es.onopen = function () { setLive(true, '实时'); };
  }
  function setLive(on, text) {
    var dot = $('live-dot');
    dot.className = 'dot' + (on ? ' on' : ' err');
    $('live-text').textContent = text;
  }

  // ---------------------------------------------------------------- 事件绑定
  $('days').addEventListener('change', function () {
    var value = this.value;
    if (value === 'custom') {
      S.days = 'custom';
      $('range-box').style.display = 'inline-flex';
      if (!S.from && !S.to) return;   // 等用户选完日期再查
    } else {
      S.days = parseInt(value, 10);
      $('range-box').style.display = 'none';
    }
    S.offset = 0;
    reload();
  });
  $('from').addEventListener('change', function () { S.from = this.value; S.offset = 0; reload(); });
  $('to').addEventListener('change', function () { S.to = this.value; S.offset = 0; reload(); });
  $('limit').addEventListener('change', function () {
    S.limit = parseInt(this.value, 10);
    S.offset = 0;
    loadTasks();
  });
  $('state').addEventListener('change', function () { S.state = this.value; S.offset = 0; loadTasks(); });

  var qTimer = null;
  $('q').addEventListener('input', function () {
    var v = this.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { S.q = v; S.offset = 0; loadTasks(); }, 260);
  });
  $('user-q').addEventListener('input', function () { S.userQ = this.value; renderUsers(); });

  $('user-list').addEventListener('click', function (e) {
    var row = e.target.closest('[data-user]');
    if (!row) return;
    S.user = row.getAttribute('data-user');
    S.offset = 0;
    if (!S.user) S.role = 'all';
    document.querySelectorAll('#role-tabs .tab').forEach(function (t) {
      t.classList.toggle('on', t.getAttribute('data-role') === S.role);
    });
    renderUsers(); loadTasks();
  });

  $('role-tabs').addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    S.role = tab.getAttribute('data-role');
    S.offset = 0;
    document.querySelectorAll('#role-tabs .tab').forEach(function (t) { t.classList.remove('on'); });
    tab.classList.add('on');
    loadTasks();
  });

  $('task-body').addEventListener('click', function (e) {
    if (e.target.id === 'pg-prev') {
      S.offset = Math.max(0, S.offset - S.limit);
      loadTasks();
      return;
    }
    if (e.target.id === 'pg-next') {
      S.offset = S.offset + S.limit;
      loadTasks();
      return;
    }
    var tr = e.target.closest('tr[data-id]');
    if (!tr) return;
    openDrawer(tr.getAttribute('data-id'));
  });

  $('d-close').addEventListener('click', closeDrawer);
  $('backdrop').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

  // ---------------------------------------------------------------- 启动
  reload();
  connectStream();
  // 进行中的任务耗时在本地走秒，不必等轮询（看板要有“正在跑”的实时感）
  setInterval(function () {
    if (document.hidden) return;
    var nowSec = Date.now() / 1000;
    Array.prototype.forEach.call(document.querySelectorAll('td.dur[data-since]'), function (td) {
      var since = parseFloat(td.getAttribute('data-since'));
      if (!since) return;
      var span = td.querySelector('.dv');
      if (span) span.textContent = dur(nowSec - since);
    });
  }, 1000);

  // 兜底轮询：SSE 断了也不至于看到过期数据
  setInterval(function () { if (!document.hidden) reload(); }, 10000);
})();
</script>
</body>
</html>
