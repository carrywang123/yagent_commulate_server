<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>跨端任务追踪 · YAgent Relay</title>
<style>
  /* ==========================================================================
     配色与排版直接沿用 YAgent Desk 自身的设计 token
     （src/renderer/src/styles/index.scss 与 GameEditorWorkspace/vendor/tokens.css），
     不再自己另起一套——看板是这套产品的一部分，长得像它才不突兀。

       背景  #f7f7f5 暖白    面板 #f1f1ee / #efefec 暖灰
       描边  #deded9 / #e1e5eb   文字 #252522 / #1a1916
       强调  #c96442 陶土橙（产品的主色，不是蓝）
       语义  绿 #1f7a3a / 红 #9c2a25 / 琥珀 #b26200 / 蓝 #2348b8

     信息层级仍然按上一版的三条规矩：靠字号字重留白分级，颜色只表达
     「谁发起的」和「什么状态」，一屏只有一个强调色。
     ========================================================================== */
  :root {
    --bg: #f7f7f5;
    --bg-app: #faf9f7;
    --panel: #fdfcfa;
    --panel-2: #f1f1ee;
    --panel-3: #efefec;
    --fill: rgba(0,0,0,.03);
    --fill-2: rgba(0,0,0,.06);

    --line: #deded9;
    --line-2: #e1e5eb;
    --line-soft: #edf0f4;

    --ink: #1a1916;
    --ink-2: #3d3d38;
    --ink-3: #74716b;
    --ink-4: #989590;
    --ink-5: #b3b0a8;

    --accent: #c96442;
    --accent-strong: #b45a3b;
    --accent-tint: #fbeee5;

    --green: #1f7a3a;   --green-bg: #e8f7ee;   --green-bd: #c6ead2;
    --red: #9c2a25;     --red-bg: #fdecea;     --red-bd: #f5c6c2;
    --amber: #b26200;   --amber-bg: #fff3e0;   --amber-bd: #f2ddb8;
    --blue: #2348b8;    --blue-bg: #e8efff;    --blue-bd: #c8d6ff;
    --purple: #6c3aa6;  --purple-bg: #f3ecf9;  --purple-bd: #e4d4f1;

    --sh-xs: 0 1px 0 rgba(28,27,26,.04);
    --sh-sm: 0 1px 2px rgba(28,27,26,.05), 0 1px 3px rgba(28,27,26,.04);
    --sh-md: 0 6px 24px rgba(28,27,26,.07), 0 2px 6px rgba(28,27,26,.04);
    --sh-lg: 0 24px 60px rgba(28,27,26,.16), 0 8px 16px rgba(28,27,26,.07);

    --sans: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  ::selection { background: var(--accent-tint); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d5d5d0; border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #c2c2bc; }
  ::-webkit-scrollbar-track { background: transparent; }
  .mono { font-family: var(--mono); }
  .num { font-variant-numeric: tabular-nums; }

  /* ============================ 顶栏 ============================ */
  header {
    display: flex; align-items: center; gap: 16px; flex: none;
    height: 60px; padding: 0 16px;
    background: var(--panel-2); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 28px; height: 28px; flex: none; border-radius: 9px;
    background: #1f1f1d; color: #fff; font-weight: 700; font-size: 13px;
    display: grid; place-items: center;
  }
  .brand .tt { min-width: 0; }
  .brand h1 { font-size: 15px; font-weight: 600; margin: 0; color: #55554f;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand .sub { font-size: 11px; color: var(--ink-4); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .ctrl { display: flex; align-items: center; gap: 8px; }

  select, input[type=text], input[type=date] {
    appearance: none; -webkit-appearance: none;
    background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font: inherit; font-size: 12px; outline: none;
    transition: border-color .14s, box-shadow .14s, background .14s;
  }
  select:hover, input:hover { border-color: #c9c9c3; }
  select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  select { cursor: pointer; padding-right: 26px;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-4) 50%),
                      linear-gradient(135deg, var(--ink-4) 50%, transparent 50%);
    background-position: calc(100% - 14px) 51%, calc(100% - 10px) 51%;
    background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; }
  input[type=text] { width: 200px; }
  input[type=date] { width: 124px; }

  .seg { display: flex; gap: 2px; background: #e8e8e3; border-radius: 9px; padding: 3px; }
  .seg .sg {
    padding: 6px 15px; font-size: 12px; font-weight: 600; border-radius: 7px;
    cursor: pointer; color: #6c6c64; user-select: none; transition: .14s; white-space: nowrap;
  }
  .seg .sg:hover { color: #45453f; }
  .seg .sg.on { background: var(--panel); color: var(--ink); box-shadow: var(--sh-xs); }

  .live { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-4);
    padding-left: 4px; }
  .live .d { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-5); transition: .3s; }
  .live .d.on { background: var(--green); }
  .live .d.off { background: var(--red); }

  /* ============================ 指标条 ============================ */
  .stats { display: flex; align-items: stretch; flex: none; height: 64px;
    padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .st { display: flex; flex-direction: column; justify-content: center;
    padding: 0 20px; position: relative; min-width: 0; }
  .st:first-child { padding-left: 4px; }
  .st + .st::before { content: ''; position: absolute; left: 0; top: 18px; bottom: 18px;
    width: 1px; background: var(--line); }
  .st .k { font-size: 11px; color: var(--ink-4); white-space: nowrap; margin-bottom: 1px; }
  .st .v { font-size: 17px; font-weight: 600; color: var(--ink-2);
    font-variant-numeric: tabular-nums; line-height: 1.2; }
  .st.hero .v { font-size: 24px; color: var(--ink); }
  .st .v.hot { color: var(--accent); }
  .st .v.bad { color: var(--red); }
  .st .v.z { color: var(--ink-5); font-weight: 500; }
  .st.hide { display: none; }
  .stats-sp { flex: 1; }

  /* ============================ 主体 ============================ */
  main { flex: 1; display: grid; grid-template-columns: 212px minmax(0, 1fr); min-height: 0; }
  .side { background: var(--panel-3); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; }
  .main-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }

  .colhead { display: flex; align-items: center; gap: 14px; flex: none;
    height: 48px; padding: 0 18px; border-bottom: 1px solid var(--line);
    background: var(--panel); }
  .colhead h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--ink); }
  .colhead .hint { font-size: 11px; color: var(--ink-4); }
  .tabs { display: flex; gap: 14px; }
  .tabs .tb { font-size: 12px; color: var(--ink-3); cursor: pointer; padding: 3px 0;
    border-bottom: 1.5px solid transparent; transition: .14s; user-select: none; font-weight: 500; }
  .tabs .tb:hover { color: var(--ink-2); }
  .tabs .tb.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .scroller { flex: 1; overflow: auto; min-height: 0; }

  /* ---------------------------- 用户侧栏 ---------------------------- */
  .usearch { padding: 10px 10px 6px; flex: none; }
  .usearch input { width: 100%; background: var(--panel); font-size: 12px; }
  .user { padding: 7px 10px; margin: 0 6px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; }
  .user:hover { background: #e6e6e1; }
  .user.on { background: #e4ece6; }
  .user .nm { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 500; color: #45453f;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user.on .nm { color: #2f6f4f; font-weight: 600; }
  .user .ct { flex: none; font-size: 10px; font-weight: 600; color: #7b7b73;
    background: #dfdfda; border-radius: 8px; padding: 0 5px; line-height: 15px; }
  .user .ct.a { background: var(--accent-tint); color: var(--accent-strong); }
  .user .ct.b { background: var(--red-bg); color: var(--red); }
  .user .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; }
  .user.all { font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .user.all.on { color: #2f6f4f; }

  /* ---------------------------- 列表 ---------------------------- */
  .list { padding: 8px 10px 40px; }
  .row { background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px;
    padding: 12px 14px 12px 16px; margin-bottom: 8px; cursor: pointer; position: relative;
    transition: border-color .14s, box-shadow .14s; }
  .row:hover { border-color: #cfd5dd; box-shadow: var(--sh-sm); }
  .row.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  /* 状态色只落在左侧这根色条上，不铺满整行 */
  .row .rail { position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--c, var(--ink-5)); }

  /* 任务视图：一条链路一张卡片。卡片边界就是任务边界 ——
     让「哪些消息属于同一件事」一眼可见，而不是散在流水列表里靠小标认亲 */
  .glist { padding: 8px 10px 40px; }
  .gcard { background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px;
    margin-bottom: 14px; overflow: hidden; box-shadow: var(--sh-sm); }
  .gcard.act { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  .gh { display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    background: var(--ink-1, #f7f8fa); border-bottom: 1px solid var(--line-2);
    border-left: 4px solid var(--c, var(--ink-5)); }
  .gh .gn { font-size: 12px; font-weight: 600; color: var(--ink-60, #606a76);
    background: var(--panel); border: 1px solid var(--line-2);
    border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
  .gh .gsum { font-size: 13px; font-weight: 600; color: var(--ink-90, #1f2933);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52%; }
  .gh .gbadge.run { font-size: 11px; color: #1b6ef3; background: #eaf2ff;
    border: 1px solid #c3dbff; border-radius: 999px; padding: 1px 8px; }
  .gh { cursor: pointer; }
  .gh:hover { background: #eef1f5; }
  /* 默认折叠：只看到一行源头摘要，点头部展开 */
  /* 参与通信的用户：紧跟摘要放在左边，靠右的话宽屏上跟摘要隔得太远，根本注意不到 */
  .gh .gusers { flex: none; font-size: 11.5px; font-weight: 600; color: var(--ink-2, #3a4452);
    background: var(--panel-2, #f2f4f6); border: 1px solid var(--line, #e3e6ea);
    border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
  /* ---------- 快捷筛选条 ---------- */
  .quick { padding: 10px 18px 2px; display: flex; flex-direction: column; gap: 6px; }
  .qrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .qrow .ql { width: 30px; flex: none; font-size: 11px; color: var(--ink-4); }
  .qc { cursor: pointer; user-select: none; font-size: 12px; padding: 3px 11px;
    border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel);
    color: var(--ink-2); transition: background .12s, border-color .12s, color .12s; }
  .qc:hover { background: var(--fill); border-color: var(--line); }
  .qc.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .qc.bad.on { background: #d64545; border-color: #d64545; }
  /* ---------- 当前筛选态 ---------- */
  .fbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 18px 0; font-size: 12px; }
  .fbar .ft { display: inline-flex; align-items: center; gap: 6px; padding: 2px 6px 2px 10px;
    border-radius: 999px; background: var(--accent-tint); border: 1px solid var(--accent);
    color: var(--ink-1); }
  .fbar .ft b { font-weight: 600; }
  .fbar .ft i { cursor: pointer; font-style: normal; color: var(--ink-3);
    padding: 0 3px; border-radius: 50%; }
  .fbar .ft i:hover { background: #0002; color: var(--ink-1); }
  .fbar .fclear { cursor: pointer; color: var(--accent); text-decoration: underline;
    margin-left: 4px; }
  /* ---------- 统计面板 ---------- */
  #stats-body { padding: 12px 16px 28px; }
  /* 顶部范围条 */
  .abar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 13px; margin-bottom: 11px; font-size: 12px; color: var(--ink-3);
    background: var(--fill); border: 1px solid var(--line-2); border-radius: 9px; }
  .abar b { color: var(--ink-1); }
  .abar .asep { color: var(--ink-5); }
  .abar .agrow { flex: 1; }
  .abar .ahint { color: var(--ink-4); }
  .swarn { margin-left: 6px; padding: 1px 8px; border-radius: 999px;
    background: #fdf7e8; color: #8a6516; border: 1px solid #ecdcb4; }
  /* 四个核心指标 */
  .ahero { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 11px; margin-bottom: 13px; }
  .hcard { padding: 13px 15px; background: var(--panel);
    border: 1px solid var(--line-2); border-radius: 12px; }
  .hcard .hk { font-size: 11.5px; color: var(--ink-4); }
  .hcard .hv { margin: 4px 0 2px; font-size: 27px; font-weight: 700; color: var(--ink-1);
    line-height: 1.15; }
  .hcard .hv.ok { color: #2f855a; } .hcard .hv.bad { color: #d64545; }
  .hcard .hv.warn { color: #b7791f; }
  .hcard .hs { font-size: 11px; color: var(--ink-4); }
  /* 卡片网格：默认两列，通栏用 .wide */
  .agrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 13px; }
  .acard { padding: 13px 15px; background: var(--panel);
    border: 1px solid var(--line-2); border-radius: 12px; min-width: 0; }
  .acard.wide { grid-column: 1 / -1; }
  .acard h3 { margin: 0 0 11px; font-size: 13.5px; color: var(--ink-1); }
  .ssub { margin: 12px 0 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
  .snote { margin-top: 9px; font-size: 11px; line-height: 1.75; color: var(--ink-4); }
  .snote b { color: var(--ink-2); }
  /* 环形图 */
  .donut { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .dsvg { flex: none; width: 128px; height: 128px; }
  .dsvg text.dnum { font-size: 19px; font-weight: 700; fill: var(--ink-1);
    text-anchor: middle; font-family: var(--mono); }
  .dsvg text.dlab { font-size: 8px; fill: var(--ink-4); text-anchor: middle; }
  .dlegend { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 3px; }
  .dlgi { display: flex; align-items: center; gap: 7px; font-size: 12px; padding: 2px 4px;
    border-radius: 5px; }
  .dlgi[data-jump] { cursor: pointer; }
  .dlgi[data-jump]:hover { background: var(--fill); }
  .dlgi i { flex: none; width: 9px; height: 9px; border-radius: 2px; }
  .dlgi .dn { flex: 1; min-width: 0; color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlgi b { flex: none; font-weight: 700; color: var(--ink-1); font-family: var(--mono); }
  .dlgi em { flex: none; width: 46px; text-align: right; font-style: normal;
    font-size: 11px; color: var(--ink-4); font-family: var(--mono); }
  /* 纵向柱状：div 实现，文字用真实 CSS 字号，不会被 SVG 拉伸变形 */
  .vb { display: flex; align-items: flex-end; gap: 6px; height: 146px; padding-top: 6px; }
  .vbcol { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
  .vbcol .vbbar { flex: 1; display: flex; align-items: flex-end; justify-content: center;
    min-height: 0; }
  .vbcol .vbfill { width: 100%; max-width: 44px; min-height: 3px; border-radius: 4px 4px 0 0;
    position: relative; display: flex; justify-content: center; }
  .vbcol .vbfill.zero { height: 3px; background: var(--line-2); }
  /* 数值挂在柱子正上方，跟着柱高走 */
  .vbcol .vbnum { position: absolute; top: -17px; font-size: 12px; font-weight: 600;
    color: var(--ink-1); font-family: var(--mono); white-space: nowrap; line-height: 1; }
  .vbcol .vbnum.dim { color: var(--ink-5); font-weight: 400; }
  /* 轴标签：给足高度并与柱底脱开，不然会被压在柱子上看不清
     （这里不用 overflow:hidden 截断：「5-30s」「直接发起」这种实测会被切掉） */
  .vbcol .vblab { height: 30px; padding-top: 9px; font-size: 11.5px; color: var(--ink-2);
    text-align: center; line-height: 1.25; word-break: keep-all; }
  .vbcol:hover .vbfill { filter: brightness(1.08); }
  .vbcol.clickable { cursor: pointer; border-radius: 6px; transition: background .12s; }
  .vbcol.clickable:hover { background: var(--fill); }
  .vbcol.clickable:hover .vblab { color: var(--accent, #1b6ef3); }
  /* ---------- 问题视角（按根因聚合的失败）---------- */
  .ilist { display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 10px; }
  .itip { font-size: 12px; color: var(--ink-3); background: var(--fill);
    border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 11px; }
  .issue { border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px;
    background: var(--panel); cursor: pointer; transition: border-color .12s, box-shadow .12s; }
  .issue:hover { border-color: var(--accent, #1b6ef3);
    box-shadow: 0 0 0 3px var(--accent-tint, #eaf2ff); }
  .ihead { display: flex; align-items: center; gap: 8px; }
  /* 发生次数放最大：按影响面排序的列表，次数就是第一眼要看的 */
  .icount { font-size: 19px; font-weight: 700; color: var(--bad, #c03535);
    font-family: var(--mono); min-width: 30px; }
  .ilabel { font-size: 13.5px; font-weight: 600; color: var(--ink-1); }
  .inew { font-size: 10.5px; color: #fff; background: var(--bad, #c03535);
    border-radius: 4px; padding: 1px 6px; font-weight: 600; }
  .imet { font-size: 11.5px; color: var(--ink-4); font-family: var(--mono); }
  .ibar { height: 4px; background: var(--line-soft); border-radius: 3px;
    overflow: hidden; margin: 7px 0 6px; }
  .ibar i { display: block; height: 100%; background: var(--bad, #c03535); opacity: .65; }
  .iwho { font-size: 12.5px; color: var(--ink-2); }
  .iwho b { color: var(--ink-1); }
  .idim { color: var(--ink-4); margin-left: 6px; font-size: 11.5px; }
  .ihint { font-size: 11.5px; color: var(--ink-4); margin-top: 3px; }
  .isamp { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
  .isamp span { font-size: 11.5px; color: var(--ink-3); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; padding-left: 10px;
    border-left: 2px solid var(--line-2); }
  /* 横向条形 */
  .srows { display: flex; flex-direction: column; gap: 4px; }
  .srow { display: flex; align-items: center; gap: 9px; font-size: 12px; }
  .srow.clickable { cursor: pointer; border-radius: 6px; }
  .srow.clickable:hover { background: var(--fill); }
  .srow .sname { flex: none; width: 140px; color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .srow .strack { flex: 1; height: 14px; background: var(--fill);
    border-radius: 4px; overflow: hidden; min-width: 30px; }
  .srow .sfill { height: 100%; background: #4c7fd4; border-radius: 4px; }
  .srow .sfill.bad { background: #d97b72; }
  .srow .sval { flex: none; min-width: 34px; text-align: right;
    color: var(--ink-3); font-size: 11px; font-family: var(--mono); }
  /* 趋势图：div 布局，每根柱子自带日期和数值 */
  .tchart2 { position: relative; height: 172px; margin-top: 4px; }
