<div class="scrim" id="backdrop"></div>
<aside class="panel" id="drawer">
  <div class="ph">
    <div class="grow">
      <div id="d-title">详情</div>
      <div class="sub" id="d-id"></div>
    </div>
    <button class="xbtn" id="d-close" aria-label="关闭">×</button>
  </div>
  <div class="pb" id="d-body"></div>
</aside>

<script>
(function () {
  'use strict';

  var S = {
    days: 0, from: '', to: '', user: '', role: 'all', state: 'all', q: '', userQ: '',
    kpi: {}, users: [], tasks: [], links: [], edges: [], orphan: 0, groups: [], openChains: {},
    total: 0, limit: 500, offset: 0,
    view: 'stats', selected: null, selectedLink: null,
    // 统计面板点下钻带过来的维度，都是可选的，空字符串/null 表示不限
    error: '', durMin: null, durMax: null, depth: null, struct: '', pair: '',
    flash: {}, loading: false, dirty: false, retention: ''
  };

  /* 状态 → 语义色，直接用产品 token 里的浅底 + 描边那一套 */
  var STATE = {
    sent:          { t: '已发出',   v: 'd', run: true  },
    delivered:     { t: '已送达',   v: 'b', run: true  },
    queued:        { t: '排队中',   v: 'y', run: true  },
    working:       { t: '处理中',   v: 'y', run: true  },
    deferred:      { t: '已推迟',   v: 'p', run: false },
    pending_retry: { t: '待重投',   v: 'y', run: true  },
    done:          { t: '已完成',   v: 'g', run: false },
    failed:        { t: '失败',     v: 'r', run: false },
    cancelled:     { t: '已撤回',   v: 'd', run: false },
    notified:      { t: '已通知',   v: 'b', run: false }
  };
  var LINK = {
    active: { t: '进行中', v: 'y', run: true  },
    failed: { t: '有失败', v: 'r', run: false },
    done:   { t: '已完成', v: 'g', run: false }
  };
  var STATE_OPTS = {
    // 链路现在就是任务，筛选口径跟任务一致（命中链上任意节点即保留整条）
    links: [['all', '全部链路'], ['active', '进行中'], ['silent', '已静默'],
            ['done', '已完成'], ['failed', '失败'], ['notified', '单向通知']],
    tasks: [['all', '全部状态'], ['active', '进行中'], ['working', '处理中'], ['queued', '排队中'],
            ['silent', '已静默'], ['done', '已完成'], ['failed', '失败'],
            ['cancelled', '已撤回'], ['notified', '单向通知']]
  };

  // ============================================================ 工具
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function dur(sec) { return window.TraceDuration(sec); }
  // List rendering must not depend on the graph script's version or availability.
  function formatDate(ts, seconds) {
    if (ts == null || ts === '' || !Number.isFinite(Number(ts))) return '未记录';
    var d = new Date(Number(ts) * 1000);
    if (!Number.isFinite(d.getTime())) return '未记录';
    var p = function(n) { return String(n).padStart(2, '0'); };
    return (seconds || d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '年' : '') +
      p(d.getMonth()+1) + '月' + p(d.getDate()) + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes()) +
      (seconds ? ':' + p(d.getSeconds()) : '');
  }
  function hhmm(ts) { return formatDate(ts, false); }
  function full(ts) { return formatDate(ts, true); }
  function ago(ts) { return ts ? dur(Date.now() / 1000 - ts) + '前' : ''; }
  function sm(s) { return STATE[s] || { t: s || '未知', v: 'd', run: false }; }
  function lm(L) {
    if (L.active_turns) return LINK.active;
    if (L.failed_turns) return LINK.failed;
    return LINK.done;
  }
  function sess(s) {
    s = String(s || '');
    if (!s) return '';
    return s.length <= 22 ? s : '…' + s.slice(-7);
  }
  var VCOLOR = {
    g: ['var(--green-bg)', 'var(--green)', 'var(--green-bd)'],
    r: ['var(--red-bg)', 'var(--red)', 'var(--red-bd)'],
    y: ['var(--amber-bg)', 'var(--amber)', 'var(--amber-bd)'],
    b: ['var(--blue-bg)', 'var(--blue)', 'var(--blue-bd)'],
    p: ['var(--purple-bg)', 'var(--purple)', 'var(--purple-bd)'],
    d: ['var(--fill)', 'var(--ink-3)', 'var(--line-2)']
  };
  function pill(m) {
    var c = VCOLOR[m.v] || VCOLOR.d;
    return '<span class="pill' + (m.run ? ' on' : '') + '" style="--pbg:' + c[0] +
      ';--pfg:' + c[1] + ';--pbd:' + c[2] + '"><i></i>' + esc(m.t) + '</span>';
  }
  function bit(cls, text) { return '<span class="bit ' + cls + '">' + esc(text) + '</span>'; }
  /** 参与方：发起方最深，处理方次之，中间一个强调色箭头指示方向 */
  function who(name, session, role, withSess) {
    var ss = withSess && session ? '<span class="ss">' + esc(sess(session)) + '</span>' : '';
    return '<span class="who ' + role + '"' + (session ? ' title="' + esc(session) + '"' : '') + '>' +
      esc(name || '?') + ss + '</span>';
  }
  function api(p) {
    return fetch(p, { headers: { 'Accept': 'application/json' } }).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (b) {
        throw new Error((b.detail && b.detail.message) || ('HTTP ' + r.status));
      });
      return r.json();
    });
  }
  function fillState() {
    // 统计视图没有自己的状态口径，借用链路的；
    // 不做这个兜底 STATE_OPTS['stats'] 会是 undefined，启动时直接报错中断初始化。
    var opts = STATE_OPTS[S.view] || STATE_OPTS.links, keep = S.state, ok = false;
    $('state').innerHTML = opts.map(function (o) {
      if (o[0] === keep) ok = true;
      return '<option value="' + o[0] + '">' + o[1] + '</option>';
    }).join('');
    S.state = ok ? keep : 'all';
    $('state').value = S.state;
  }

  // ============================================================ 指标 / 用户
  function renderStats() {
    var k = S.kpi || {};
    function set(id, val, hot, zero, bad) {
      var el = $(id);
      el.textContent = val;
      el.className = 'v' + (hot ? ' hot' : '') + (zero ? ' z' : '') + (bad ? ' bad' : '');
    }
    set('k-active', k.active != null ? k.active : '—', k.active > 0, !k.active);
    set('k-silent', k.silent != null ? k.silent : '—', k.silent > 0, !k.silent);
    set('k-done', k.done != null ? k.done : '—', false, false);
    set('k-failed', k.failed != null ? k.failed : '—', false, !k.failed, k.failed > 0);
    set('k-notified', k.notified != null ? k.notified : '—', false, false);
    set('k-online', k.online_clients != null ? k.online_clients : '—', false, false);
    set('k-avg', k.avg_duration != null ? dur(k.avg_duration) : '—', false, k.avg_duration == null);
    set('k-p95', k.p95_duration != null ? dur(k.p95_duration) : '—', false, k.p95_duration == null);
    $('scope-hint').textContent = (k.tasks_total || 0) + ' 条任务 · ' + rangeText() +
      (S.retention ? ' · 保留' + S.retention : '');
  }
  function renderUsers() {
    var list = S.users.filter(function (u) {
      return !S.userQ || u.client_id.toLowerCase().indexOf(S.userQ.toLowerCase()) >= 0;
    });
    $('user-count').textContent = list.length + ' 人';
    var html = '<div class="user all' + (S.user ? '' : ' on') + '" data-user="">全部用户</div>';
    if (!list.length) {
      html += '<div style="padding:14px 12px;font-size:12px;color:var(--ink-5)">没有匹配的用户</div>';
    }
    list.forEach(function (u) {
      var act = (u.sent_active || 0) + (u.handled_active || 0);
      var bad = (u.sent_failed || 0) + (u.handled_failed || 0);
      var ct = act ? '<span class="ct a">' + act + ' 进行中</span>'
             : (bad ? '<span class="ct b">' + bad + ' 失败</span>' : '');
      html += '<div class="user' + (S.user === u.client_id ? ' on' : '') + '" data-user="' + esc(u.client_id) + '">' +
        (u.online ? '<span class="dot" title="在线"></span>' : '') +
        '<span class="nm">' + esc(u.client_id) + '</span>' + ct +
      '</div>';
    });
    $('user-list').innerHTML = html;
  }

  function ballLine(L, noIndent) {
    var list = L.ball_at || [];
    if (!list.length) return '';
    var parts = list.map(function (b) {
      return '<span class="nm">' + esc(b.client || '?') + '</span> ' + esc(sm(b.state).t) +
        (b.silent ? ' <span class="sl">静默 ' + dur(b.silent_for) + '</span>' : '');
    });
    return '<div class="ball"' + (noIndent ? ' style="margin-top:0"' : '') + '>' +
      '<span class="ic">◆</span><span>当前等待</span>' +
      parts.join('<span class="sep">·</span>') + '</div>';
  }

  // ============================================================ 链路列表
  var groupOpen = new Map(), visibleGroups = [], branchGroups = [], sharedLinks = {}, listGeneration = 0;
  function renderLinks() {
    var box = $('task-body');
    $('task-title').textContent = S.user ? S.user + ' 的链路' : '全部链路';

    if (!S.links.length) {
      box.innerHTML = '<div class="empty"><div class="big">没有符合条件的链路</div>' +
        '<div class="sm">链路按「一对会话」聚合。换个用户、状态或时间范围试试' +
        (S.orphan ? '<br>另有 ' + S.orphan + ' 条任务因缺少会话 ID 无法归入链路，切到「任务」视图可看' : '') +
        '</div></div>';
      return;
    }
    var childCount = {}, parentOf = {};
    (S.edges || []).forEach(function (e) {
      childCount[e.parent_link] = (childCount[e.parent_link] || 0) + 1;
      parentOf[e.child_link] = e.parent_link;
    });
    var pairSeen = {};
    S.links.forEach(function (L) {
      var k = [L.a.client || '?', L.b.client || '?'].sort().join('\u0000');
      pairSeen[k] = (pairSeen[k] || 0) + 1;
    });

    function renderLink(L) {
      var m = lm(L);
      var pk = [L.a.client || '?', L.b.client || '?'].sort().join('\u0000');
      var ws = (L.a.client && L.a.client === L.b.client) || pairSeen[pk] > 1;

      var bits = '';
      if (sharedLinks[L.link_key]>1) bits += bit('p','共享通信 · '+sharedLinks[L.link_key]+' 组');
      if (L.failed_turns) bits += bit('r', L.failed_turns + ' 次通信失败');
      if (L.silent_turns) bits += bit('y', L.silent_turns + ' 次通信长时间无更新');
      if (childCount[L.link_key]) bits += bit('p', '含 ' + childCount[L.link_key] + ' 条下游');
      if (parentOf[L.link_key]) bits += bit('d', '下游链路');
      if (L.via_endpoint) bits += bit('y', '经入口');

      var last = (L.recent_turns && L.recent_turns.length)
        ? L.recent_turns[L.recent_turns.length - 1] : null;
      var line2;
      if (last) {
        var from = last.direction === 'a2b' ? L.a : L.b;
        var to = last.direction === 'a2b' ? L.b : L.a;
        line2 = '<span class="met">' + esc(from.client || '?') + '</span>' +
          '<span class="dir r" style="font-size:12px">→</span>' +
          '<span class="met">' + esc(to.client || '?') + '</span>' +
          '<span class="sum hi grow">' + (esc(last.summary) || '（无摘要）') + '</span>';
      } else {
        line2 = '<span class="none grow">（还没有通信记录）</span>';
      }

      return '<div class="row' + (S.selectedLink === L.link_key ? ' on' : '') + '" data-link="' +
          esc(L.link_key) + '" style="--c:' + (VCOLOR[m.v] || VCOLOR.d)[1] + '">' +
        '<span class="rail"></span>' +
        '<div class="l1">' +
          who(L.a.client, L.a.session, 'a', ws) +
          '<span class="dir">⇄</span>' +
          who(L.b.client, L.b.session, 'b', ws) +
          '<span class="grow"></span>' +
          (bits ? '<span class="bits">' + bits + '</span>' : '') +
          pill(m) +
          '<span class="tp" title="每次请求或通知计一次通信，回复不重复计数"><b>共 ' + L.turns + ' 次通信</b></span>' +
          '<span class="met">最近活动 ' + esc(hhmm(L.last_at)) + '</span>' +
        '</div>' +
        '<div class="link-directions">' +
          esc((L.a.client===L.b.client ? L.a.client+'（左侧会话）' : L.a.client) + ' 发给 ' + (L.a.client===L.b.client ? L.b.client+'（右侧会话）' : L.b.client) + ' ' + L.turns_a_to_b + ' 次') + '；' +
          esc((L.a.client===L.b.client ? L.b.client+'（右侧会话）' : L.b.client) + ' 发给 ' + (L.a.client===L.b.client ? L.a.client+'（左侧会话）' : L.a.client) + ' ' + L.turns_b_to_a + ' 次') +
        '</div><div class="l2">' + line2 + '</div>' +
        ballLine(L) +
      '</div>';
    }
    var html = visibleGroups.map(function(g) {
      var failures=g.links.reduce(function(n,L){return n+(L.failed_turns||0);},0);
      var turns=g.links.reduce(function(n,L){return n+L.turns;},0);
      var names=window.TraceBranches.title(g.tasks);
      var excerpt=(g.tasks.slice().sort(function(a,b){return (b.created_at||0)-(a.created_at||0);})[0].summary||'无摘要').slice(0,90);
      return '<details class="trace-group" data-group="'+esc(g.id)+'"'+(groupOpen.get(g.id)?' open':'')+'><summary><strong>'+esc(names)+'</strong><span>最近活动 '+esc(hhmm(g.lastAt))+' · '+(S.user?'当前会话视角':'发起分支')+' · '+g.links.length+' 个通信入口 · '+turns+' 次通信</span>'+(failures?'<b class="group-failed">失败 '+failures+' 次</b>':'')+'<span class="group-toggle"></span></summary><div class="group-help group-preview">最近消息：'+esc(excerpt)+'</div><div class="group-help">'+g.matched+' 个入口命中筛选；以下为'+(S.user?'当前会话直接上游一层及下游':'完整分支')+'。共享通信会出现在其他组，顶部总计不重复累计。</div><button data-open-branch="'+esc(g.id)+'">查看本组对话图</button><div class="group-rows">'+g.links.map(renderLink).join('')+'</div></details>';
    }).join('');
    box.innerHTML = '<div class="group-help">全部用户展示完整发起分支；选中用户后，按其每个会话仅保留直接上游一层及下游，组名、列表与打开的图范围一致。不同来源分组，共同下游标为共享通信。排序：有进行中通信的组优先，再按组内最近活动时间从新到旧。</div><div class="list">' + html + '</div>' + pager() +
      (S.orphan ? '<div class="foot">另有 ' + S.orphan + ' 条任务因缺少会话 ID 无法归入链路，切到「任务」视图可看</div>' : '');
  }

  // ============================================================ 任务列表
  function renderTasks() {
    var box = $('task-body');
    $('task-title').textContent = S.user
      ? S.user + ' 的' + (S.role === 'sent' ? '发出任务' : S.role === 'handled' ? '处理任务' : '任务')
      : '全部任务';
    if (!S.tasks.length) {
      box.innerHTML = '<div class="empty"><div class="big">没有符合条件的任务</div>' +
        '<div class="sm">换个用户、状态或时间范围试试。数据长期保留，选「全部历史」可查到最早一条</div></div>';
      return;
    }
    var html = S.tasks.map(function (t) {
      var m = sm(t.state);
      var ws = t.requester && t.requester === t.handler;
      var bits = '';
      if (t.kind === 'notify' && t.state !== 'notified') bits += bit('b', '单向通知');
      if (t.silent) bits += bit('y', '已静默');
      if (t.error_code) bits += bit('r', t.error_code);
      if (t.via_endpoint) bits += bit('y', '经入口');
      if (t.parent_task_id) bits += bit('p', '子任务');

      return '<div class="row' + (S.selected === t.task_id ? ' on' : '') + '" data-id="' +
          esc(t.task_id) + '" style="--c:' + (VCOLOR[m.v] || VCOLOR.d)[1] + '">' +
        '<span class="rail"></span>' +
        '<div class="l1">' +
          who(t.requester, t.requester_session, 'a', ws) +
          '<span class="dir">→</span>' +
          who(t.handler, t.handler_session_real || t.handler_session, 'b', ws) +
          '<span class="grow"></span>' +
          (bits ? '<span class="bits">' + bits + '</span>' : '') +
          pill(m) +
          '<span class="met">' + esc(timingText(t)) + '</span>' +
          '<span class="met">发起时间 ' + esc(hhmm(t.created_at)) + '</span>' +
        '</div>' +
        '<div class="l2">' +
          '<span class="sum grow' + (t.kind === 'notify' ? '' : ' hi') + '">' +
            (esc(t.summary) || '<span class="none">（无正文摘要）</span>') + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
    box.innerHTML = '<div class="list">' + html + '</div>' + pager();
  }

  function pager() {
    if (S.total <= pageSize()) return '';
    return '<div class="pager">' +
      '<button id="pg-prev"' + (S.offset <= 0 ? ' disabled' : '') + '>上一页</button>' +
      '<span>' + (S.offset + 1) + ' – ' + Math.min(S.offset + pageSize(), S.total) + ' / ' + S.total +
        (S.view === 'links' ? ' 条链路' : '') + '</span>' +
      '<button id="pg-next"' + (S.offset + pageSize() >= S.total ? ' disabled' : '') + '>下一页</button>' +
      '</div>';
  }
  function pageSize() {
    return S.view === 'links' ? (S.groupLimit || 20) : S.limit;
  }

  // ======================================================== 任务视图
  /* 一个任务 = 一条链路 = 一个视图。发起方开的一件事算一个任务，
     只要能顺 parent_msg_id 溯源回这条消息，就属于同一个视图。
     发起方自己又开的新消息不算（见后端 _parent_is_real）。 */
  function renderGroups() {
    var box = $('task-body');
    $('task-title').textContent = S.user
      ? S.user + ' 参与的链路'
      : '全部链路';
    if (!S.groups.length) {
      box.innerHTML = '<div class="empty"><div class="big">没有符合条件的链路</div>' +
        '<div class="sm">换个用户、状态或时间范围试试。一条链路就是一个完整任务</div></div>';
      return;
    }
    var html = S.groups.map(function (g) {
      var root = g.nodes[0] || {};
      var rm = sm(root.state);
      // 一条链路就一行，不再展开。
      // 展开里那些环节行，右侧「消息明细」已经完整呈现过一遍（还带正文、状态、耗时），
      // 在列表里再来一份只是重复，还把列表撑得老长。
      var users = [];
      var failed = 0;
      g.nodes.forEach(function (n) {
        // 后端的链路组没有 failed 字段（只有 active/size/nodes），得自己数
        if (n.state === 'failed' || n.state === 'cancelled') failed += 1;
        [n.requester, n.handler].forEach(function (u) {
          if (u && users.indexOf(u) < 0) users.push(u);
        });
      });
      var utext = users.length > 5
        ? users.slice(0, 5).join('、') + ' 等5人（共' + users.length + '人）'
        : users.join('、');
      // 整条卡片可点：打开链路抽屉（拓扑图 + 消息明细都在里面）
      var head = '<div class="gh" data-chain-root="' + esc(g.root_id) + '">' +
        '<span class="gn">' + (g.size > 1 ? g.size + ' 个环节' : '单次消息') + '</span>' +
        '<span class="gsum">' + (esc(root.summary) || '<span class="none">（无正文摘要）</span>') + '</span>' +
        (utext ? '<span class="gusers">' + esc(utext) + '</span>' : '') +
        '<span class="grow"></span>' +
        (failed ? '<span class="gbadge bad">失败 ' + failed + '</span>' : '') +
        (g.active ? '<span class="gbadge run">进行中</span>' : '') +
        pill(rm) +
        '<span class="met">' + esc(hhmm(g.created_at)) + '</span>' +
      '</div>';
      return '<div class="gcard' + (g.active ? ' act' : '') + '" style="--c:' +
        (VCOLOR[rm.v] || VCOLOR.d)[1] + '">' + head + '</div>';
    }).join('');
    box.innerHTML = '<div class="glist">' + html + '</div>' + pager();
  }

  function timingText(n) {
    if (n.total_seconds != null) return '总耗时 ' + preciseDur(n.total_seconds);
    if (n.elapsed_seconds != null) return '已耗时 ' + preciseDur(n.elapsed_seconds) + ' · 等待最终回复';
    var labels = {notified:'单向通知 · 无最终回复', failed:'失败 · 无完整回复耗时',
      cancelled:'已取消 · 无完整回复耗时', missing_start:'缺少发起记录 · 不可计算',
      missing_end:'缺少回复时间 · 不可计算', invalid_timestamps:'时间顺序异常 · 不可计算'};
    return labels[n.timing_status] || '无完整计时记录';
  }
  function preciseDur(seconds) {
    return window.TraceDuration(seconds);
  }
  // ============================================================ 链路详情
  function linkDetail(L) {
    if (L.session_graph && window.TraceSessionExplorer) {
      $('d-title').textContent = '会话通信链路 · ' + L.a.client + ' ⇄ ' + L.b.client;
      $('d-id').textContent = '当前会话直接上游一层＋下游，不按完成状态过滤';
      window.TraceSessionExplorer.mount($('d-body'), L.session_graph, {viewerClient:S.user});
      return;
    }
    $('d-body').innerHTML = '<div class="note y">当前服务尚未启用新版执行图。请使用新版服务；不退回丢失上游的旧式跳转。</div>';
    return;
  }

  // ============================================================ 任务详情
  /** 把 execution_graph 的节点按 parent_task_id 排成一棵树。
   *  数据来自后端的递归 CTE（祖先 + 后代），这里只负责排版。
   *  只有一个节点时不渲染——孤任务没有“链”可言。 */
  function chainTree(g, currentId) {
    var nodes = (g && g.nodes) || [];
    if (nodes.length < 2) return '';
    var byId = {}, kids = {}, roots = [];
    nodes.forEach(function (n) { byId[n.task_id] = n; kids[n.task_id] = []; });
    nodes.forEach(function (n) {
      var p = n.parent_task_id;
      if (p && byId[p]) kids[p].push(n); else roots.push(n);
    });
    var out = [];
    function walk(n, depth) {
      var m = sm(n.state), c = VCOLOR[m.v] || VCOLOR.d;
      out.push('<div class="crow' + (n.task_id === currentId ? ' cur' : '') +
          '" data-chain="' + esc(n.task_id) + '" style="--c:' + c[1] + ';--d:' + depth + '">' +
        '<span class="cw">' + esc(n.requester || '?') + '<span class="dir">→</span>' +
          esc(n.handler || '?') + '</span>' +
        pill(m) +
        '<span class="csum">' +
          (esc(n.summary) || '<span class="none">（无摘要）</span>') + '</span>' +
      '</div>');
      kids[n.task_id].forEach(function (k) { walk(k, depth + 1); });
    }
    roots.forEach(function (r) { walk(r, 0); });
    return '<div class="chain"><div class="chead">调用链 · 共 ' + nodes.length + ' 个任务' +
      (g.truncated ? '（已截断）' : '') + '，点击可跳转</div>' + out.join('') + '</div>';
  }

  function taskDetail(t) {
    if (t.session_graph && window.TraceSessionExplorer) {
      $('d-title').textContent = '会话通信链路 · ' + t.requester + ' → ' + t.handler;
      $('d-id').textContent = '当前会话直接上游一层＋下游 · ' + t.task_id;
      window.TraceSessionExplorer.mount($('d-body'), t.session_graph, {taskId:t.task_id,viewerClient:S.user});
      // 调用链插在会话图之前：先回答“这次任务经过了谁”，再看会话关系
      var chain = chainTree(t.execution_graph, t.task_id);
      if (chain) $('d-body').insertAdjacentHTML('afterbegin', chain);
      return;
    }
    $('d-body').innerHTML = '<div class="note y">当前服务尚未启用新版执行图。请使用新版服务；不退回丢失上游的旧式跳转。</div>';
    return;
  }

  // ============================================================ 抽屉
  function open() {
    $('drawer').classList.add('open');
    $('backdrop').classList.add('on');
    $('d-title').textContent = '加载中…';
    $('d-id').textContent = '';
    $('d-body').innerHTML = '<div class="empty"><div class="big">加载中…</div></div>';
  }
  function close() {
    S.selected = null; S.selectedLink = null;
    $('drawer').classList.remove('open', 'explorer-open');
    $('backdrop').classList.remove('on');
    if (S.view === 'links') renderGroups();
    else renderTasks();
  }
  /** 打开一条链路（= 一个任务）的图。
   *
   *  图里只放这个任务自己的节点 —— 用 fixedBranch 让 explorer 跳过按会话扩散的
   *  那套裁剪，否则会把同一对会话在别的任务里的通信也拉进来，
   *  那就又回到了「谁和谁通过信」而不是「这件事怎么跑的」。 */
  function openChain(rootId, focusId) {
    var g = null;
    for (var i = 0; i < S.groups.length; i++) {
      if (S.groups[i].root_id === rootId) { g = S.groups[i]; break; }
    }
    if (!g) return;
    S.selected = focusId || rootId; S.selectedLink = null;
    renderGroups();
    open();
    var root = g.nodes[0] || {};
    // 标题就是「这件事 + 有谁参与」，不再分主副两行。
    // 不画箭头：分叉链路本来是树，强行拉成一条线会变成
    // qirui → qirui2 → qirui → qirui2，看着像在兜圈子，实际并没有。
    var users = [];
    g.nodes.forEach(function (n) {
      [n.requester, n.handler].forEach(function (u) {
        if (u && users.indexOf(u) < 0) users.push(u);
      });
    });
    var usersText = users.length > 5
      ? users.slice(0, 5).join('、') + ' 等 ' + users.length + ' 人'
      : users.join('、');
    $('d-title').innerHTML = '<span class="dsum">' + (esc(root.summary) || esc(rootId)) + '</span>' +
      (usersText ? '<span class="dflow">' + esc(usersText) + '</span>' : '');
    $('d-id').textContent = '';
    if (window.TraceSessionExplorer) {
      window.TraceSessionExplorer.mount($('d-body'), {nodes: g.nodes}, {
        taskId: focusId || rootId,
        fixedBranch: true,
        viewerClient: S.user
      });
    }
  }
  function openTask(id) {
    S.selected = id; S.selectedLink = null;
    if (S.view === 'tasks') renderTasks();
    else renderGroups();
    open();
    api('/api/trace/tasks/' + encodeURIComponent(id)).then(function (d) {
      if (S.selected === id) taskDetail(d.task);
    }).catch(function (e) {
      $('d-body').innerHTML = '<div class="empty"><div class="big">加载失败</div><div class="sm">' + esc(e.message) + '</div></div>';
    });
  }
  function openBranch(id,key){
    var g=branchGroups.find(function(g){return g.id===id;});if(!g)return;
    S.selectedLink=key||g.links[0].link_key;S.selected=null;
    renderLinks();open();
    var t=g.tasks.find(function(t){return t.link_key===S.selectedLink;})||g.tasks[0];
    $('d-title').textContent='会话对话 · '+window.TraceBranches.title(g.tasks);
    $('d-id').textContent=(S.user?'当前用户会话：直接上游一层＋下游':'本组完整下游')+' · 共享通信统计不重复累计';
    window.TraceSessionExplorer.mount($('d-body'),{nodes:g.tasks},{taskId:t.task_id,fixedBranch:true,branchId:g.id,sharedCounts:g.sharedCounts,viewerKey:g.viewerKey,viewerClient:S.user});
  }
  function openLink(key) {
    S.selectedLink = key; S.selected = null;
    if (S.view === 'links') renderLinks();
    open();
    api('/api/trace/links/' + encodeURIComponent(key)).then(function (d) {
      if (S.selectedLink === key) linkDetail(d.link);
    }).catch(function (e) {
      $('d-body').innerHTML = '<div class="empty"><div class="big">加载失败</div><div class="sm">' + esc(e.message) + '</div></div>';
    });
  }
  // ============================================================ 数据
  function rangeParams() {
    if (S.days === 'custom') {
      var qs = '';
      if (S.from) qs += '&from=' + encodeURIComponent(S.from);
      if (S.to) qs += '&to=' + encodeURIComponent(S.to + ' 23:59:59');
      return qs || '&days=0';
    }
    return '&days=' + S.days;
  }

  // 统计面板点下钻带来的五个维度。没设的就不拼，
  // 避免发出 dur_min= 这种空值参数让后端去猜意图。
  function extraParams() {
    var qs = '';
    if (S.error) qs += '&error=' + encodeURIComponent(S.error);
    if (S.durMin != null) qs += '&dur_min=' + S.durMin;
    if (S.durMax != null) qs += '&dur_max=' + S.durMax;
    if (S.depth != null) qs += '&depth=' + S.depth;
    if (S.struct) qs += '&struct=' + encodeURIComponent(S.struct);
    if (S.pair) qs += '&pair=' + encodeURIComponent(S.pair);
    return qs;
  }
  function rangeText() {
    if (S.days === 'custom') return (S.from || '最早') + ' — ' + (S.to || '今天');
    if (String(S.days) === '0') return '全部历史';
    if (Number(S.days) === 1) return '今天';
    return '近 ' + S.days + ' 天';
  }
  function query() {
    return '?limit=' + S.limit + '&offset=' + S.offset + rangeParams() +
      '&role=' + S.role + '&state=' + encodeURIComponent(S.state) +
      '&user=' + encodeURIComponent(S.user) + '&q=' + encodeURIComponent(S.q);
  }
  function loadStats() {
    return api('/api/trace/overview' + '?x=1' + rangeParams()).then(function (d) {
      S.kpi = d.kpi; S.users = d.users || [];
      renderStats(); renderUsers();
    });
  }
  function loadTasks() {
    return api('/api/trace/tasks' + query()).then(function (d) {
      S.tasks = d.tasks || []; S.total = d.total || 0;
      renderTasks();
    });
  }
  function loadGroups() {
    // 分页单位是「组」而不是「条」：一组展开可能十几行，沿用 500 会把页面撞爆，
    // 所以这里不用 query() 里的 S.limit，单独算一个小很多的值。
    var lim = Math.max(1, Math.min(200, Math.round(S.limit / 25) || 20));
    var qs = '?limit=' + lim + '&offset=' + S.offset + rangeParams() +
      '&role=' + S.role + '&state=' + encodeURIComponent(S.state) +
      '&user=' + encodeURIComponent(S.user) + '&q=' + encodeURIComponent(S.q) +
      extraParams();
    S.groupLimit = lim;
    return api('/api/trace/task-groups' + qs).then(function (d) {
      S.groups = d.groups || []; S.total = d.total || 0;
      // 链路就是任务，顶部两个链路指标改由这个接口填
      $('k-links').textContent = d.total;
      $('k-links').className = 'v';
      $('k-links-active').textContent = d.active_total != null ? d.active_total : '—';
      renderGroups();
    });
  }
  async function allLinks(params) {
    var links=[],first=null,offset=0;
    while(true){
      var d=await api('/api/trace/links'+params+'&limit=500&offset='+offset+'&recent=1');
      if(!first)first=d;
      var batch=d.links||[];links.push.apply(links,batch);offset+=batch.length;
      if(offset>=d.total)break;
      if(!batch.length)throw Error('通信列表未读取完整，请刷新重试');
    }
    return Object.assign({},first,{links:links});
  }
  async function allBranchTasks(){
    var tasks=[],offset=0;
    while(true){var d=await api('/api/trace/tasks?days=0&state=all&limit=1000&offset='+offset);var batch=d.tasks||[];tasks.push.apply(tasks,batch);offset+=batch.length;if(offset>=d.total)return tasks;if(!batch.length)throw Error('通信数据不完整，请重试');}
  }
  async function loadLinks() {
    var generation=++listGeneration;
    var params=query().replace(/&(?:limit|offset)=[^&]*/g,'');
    var results=await Promise.all([allLinks(params),allLinks('?days=0&state=all'),allBranchTasks()]);
    if(generation!==listGeneration||S.view!=='links')return;
    var d=results[0],all=results[1],tasks=results[2].filter(function(t){return !!t.link_key;}),byLink=new Map(all.links.map(function(L){return [L.link_key,L];}));
    branchGroups=window.TraceBranches.forViewer(window.TraceBranches.build(tasks),S.user);sharedLinks={};
    branchGroups.forEach(function(g){
      g.links=g.linkKeys.map(function(k){if(!byLink.has(k))throw Error('分支入口数据不完整，请重试');sharedLinks[k]=(sharedLinks[k]||0)+1;return byLink.get(k);});
      var count=g.links.reduce(function(n,L){return n+L.turns;},0);if(count!==g.tasks.length)throw Error('通信数据正在变化，请刷新重试');
      g.active=g.links.some(function(L){return L.active_turns>0;});g.lastAt=Math.max.apply(null,g.links.map(function(L){return L.last_at||0;}));
      g.links.sort(function(a,b){return Number(b.active_turns>0)-Number(a.active_turns>0)||(b.last_at||0)-(a.last_at||0)||a.link_key.localeCompare(b.link_key);});
    });
    branchGroups.forEach(function(g){g.sharedCounts=Object.fromEntries(g.linkKeys.filter(function(k){return sharedLinks[k]>1;}).map(function(k){return [k,sharedLinks[k]];}));});
    var matched=new Set(d.links.map(function(L){return L.link_key;}));
    var ordered=branchGroups.filter(function(g){g.matched=g.linkKeys.filter(function(k){return matched.has(k);}).length;return g.matched>0;});
    ordered.sort(function(a,b){return Number(b.active)-Number(a.active)||b.lastAt-a.lastAt||a.id.localeCompare(b.id);});
    S.total=ordered.length;if(S.offset>=S.total)S.offset=0;
    visibleGroups=ordered.slice(S.offset,S.offset+S.limit);
    S.links=[...new Map(visibleGroups.flatMap(function(g){return g.links;}).map(function(L){return [L.link_key,L];})).values()];
    S.edges=d.edges||[];S.orphan=d.orphan_tasks||0;
    $('k-links').textContent=d.total;$('k-links').className='v';
    $('k-links-active').textContent=d.active_total!=null?d.active_total:'—';renderLinks();
  }
  function loadList() {
    // 链路 = 任务：走按 parent 溯源分组的接口，不再用按会话对聚合的旧口径
    if (S.view === 'stats') return loadAnalytics();
    if (S.view === 'issues') return loadIssues();
    if (S.view === 'links') return loadGroups();
    return loadTasks();
  }

  // 问题视角：把失败按根因聚合。
  // 流水列表里看到「找不到对方会话 5 次」是没法行动的，
  // 得知道是谁发给谁、什么时候开始的，才能去掉那个失效的调用。
  function loadIssues() {
    var qs = '?limit=100' + rangeParams() +
      '&role=' + S.role + '&user=' + encodeURIComponent(S.user) +
      '&q=' + encodeURIComponent(S.q);
    return api('/api/trace/failure-issues' + qs).then(function (d) {
      S.issues = d.issues || [];
      S.issueTotal = d.total || 0;
      S.issueFailures = d.total_failures || 0;
      renderIssues();
    });
  }

  function renderIssues() {
    var box = $('task-body');
    $('task-title').textContent = S.user ? S.user + ' 相关的失败问题' : '失败问题';
    if (!S.issues.length) {
      box.innerHTML = '<div class="empty"><div class="big">这个范围内没有失败</div>' +
        '<div class="sm">换个时间范围试试。一条 = 一个根因（原因 × 发起方 × 处理方）</div></div>';
      return;
    }
    var max = S.issues.reduce(function (m, x) { return Math.max(m, x.count); }, 0) || 1;
    var rows = S.issues.map(function (x) {
      var w = (x.count / max * 100).toFixed(1);
      var span = (x.first_at && x.last_at && Math.abs(x.last_at - x.first_at) > 86400)
        ? ymd(x.first_at) + ' 起，持续到 ' + ymd(x.last_at)
        : (x.first_at ? ymd(x.first_at) + ' 当天' : '时间未记录');
      return '<div class="issue" data-issue-error="' + esc(x.error_code) + '"' +
          ' data-issue-pair="' + esc(x.requester + ' → ' + x.handler) + '"' +
          ' data-issue-label="' + esc(x.label) + '">' +
        '<div class="ihead">' +
          '<span class="icount">' + x.count + '</span>' +
          '<span class="ilabel">' + esc(x.label) + '</span>' +
          (x.is_new ? '<span class="inew">新出现</span>' : '') +
          '<span class="grow"></span>' +
          '<span class="imet">' + esc(span) + '</span>' +
        '</div>' +
        '<div class="ibar"><i style="width:' + w + '%"></i></div>' +
        '<div class="iwho">' +
          '<b>' + esc(x.requester) + '</b> → <b>' + esc(x.handler) + '</b>' +
          (x.sessions > 1 ? '<span class="idim">· 涉及 ' + x.sessions + ' 个发起会话</span>' : '') +
        '</div>' +
        (x.hint ? '<div class="ihint">' + esc(x.hint) + '</div>' : '') +
        ((x.samples || []).length
          ? '<div class="isamp">' + x.samples.slice(0, 3).map(function (s) {
              return '<span>' + (esc(s.summary) || '（无摘要）') + '</span>';
            }).join('') + '</div>'
          : '') +
      '</div>';
    }).join('');
    box.innerHTML = '<div class="ilist">' +
      '<div class="itip">' + S.issueTotal + ' 个根因，共 ' + S.issueFailures +
      ' 次失败。按发生次数排序——发生得多的比刚发生一次的更值得先看。点任意一条看具体链路。</div>' +
      rows + '</div>';
  }

  function ymd(t) {
    if (!t) return '?';
    var d = new Date(t * 1000);
    return (d.getMonth() + 1) + '-' + d.getDate();
  }
  function reload() {
    if (S.loading) { S.dirty = true; return; }
    S.loading = true;
    Promise.all([loadStats(), loadList()]).catch(function (e) {
      $('task-body').innerHTML = '<div class="empty"><div class="big">加载失败</div><div class="sm">' + esc(e.message) + '</div></div>';
    }).then(function () {
      S.loading = false;
      if (S.dirty) { S.dirty = false; setTimeout(reload, 200); }
    });
  }

  // ============================================================ 快捷筛选 / 筛选态
  // 快捷条和顶部下拉是同一份状态的两个入口，必须双向同步，
  // 否则用户用下拉筛完，快捷条还高亮着旧值，会以为坏了。
  function syncQuick() {
    Array.prototype.forEach.call(document.querySelectorAll('.qc'), function (el) {
      var k = el.getAttribute('data-q'), v = el.getAttribute('data-v'), cur;
      if (k === 'days') cur = String(S.days);
      else cur = String(S.state);
      el.classList.toggle('on', cur === v);
    });
    renderFilterBar();
  }

  function renderFilterBar() {
    var bar = $('filter-bar'), bits = [];
    var dayLabel = {1: '今天', 7: '近 7 天', 14: '近 14 天', 30: '近 30 天', 90: '近 90 天'};
    if (S.days === 'custom') bits.push(['时间', (S.from || '?') + ' — ' + (S.to || '?'), 'days']);
    else if (Number(S.days) !== 0) bits.push(['时间', dayLabel[S.days] || (S.days + ' 天'), 'days']);
    var stName = {};
    (STATE_OPTS[S.view === 'stats' ? 'links' : S.view] || []).forEach(function (o) { stName[o[0]] = o[1]; });
    // 问题视角只按时间/用户/关键词聚合，不吃 state 和那五个下钻维度。
    // 把不生效的筛选条挂在上面会让人以为列表被它们筛过（实测截图里就这样）。
    var drill = S.view !== 'issues';
    if (drill && S.state && S.state !== 'all') bits.push(['状态', stName[S.state] || S.state, 'state']);
    if (S.user) bits.push(['用户', S.user + (S.role !== 'all' ? '（' + (S.role === 'sent' ? '他发出的' : '他处理的') + '）' : ''), 'user']);
    if (S.q) bits.push(['关键词', S.q, 'q']);
    // 下钻维度也得显出来，否则用户只看到列表变少了却不知道被什么筛了，
    // 也没地方把它取消。每一项都配一个 ×。
    if (drill && S.error) {
      bits.push(['失败原因', (S.errorLabel || S.error), 'error']);
    }
    if (drill && (S.durMin != null || S.durMax != null)) {
      bits.push(['耗时', (S.durLabel || ((S.durMin != null ? S.durMin + 's' : '0') + ' ~ ' +
        (S.durMax != null ? S.durMax + 's' : '不限'))), 'dur']);
    }
    if (drill && S.depth != null) {
      bits.push(['转派', S.depth === 0 ? '直接发起' : '转派 ' + S.depth + ' 次', 'depth']);
    }
    if (drill && S.struct) {
      bits.push(['结构', S.struct === 'cross' ? '跨用户' : '同用户不同会话', 'struct']);
    }
    if (drill && S.pair) bits.push(['会话对', S.pair, 'pair']);
    if (!bits.length) { bar.style.display = 'none'; bar.innerHTML = ''; return; }
    bar.style.display = '';
    bar.innerHTML = '<span style="color:var(--ink-4)">当前筛选</span>' + bits.map(function (b) {
      return '<span class="ft">' + b[0] + '：<b>' + esc(b[1]) + '</b>' +
        '<i data-drop="' + b[2] + '" title="清除这一项">×</i></span>';
    }).join('') + '<span class="fclear" data-drop="all">全部清除</span>';
  }

  function dropFilter(which) {
    if (which === 'all') {
      S.days = 0; S.from = ''; S.to = '';
      S.state = 'all'; S.user = ''; S.role = 'all'; S.q = '';
      S.error = ''; S.errorLabel = ''; S.durMin = null; S.durMax = null; S.durLabel = '';
      S.depth = null; S.struct = ''; S.pair = '';
    } else if (which === 'days') {
      S.days = 0; S.from = ''; S.to = '';
    } else if (which === 'state') S.state = 'all';
    else if (which === 'user') { S.user = ''; S.role = 'all'; }
    else if (which === 'q') S.q = '';
    else if (which === 'error') { S.error = ''; S.errorLabel = ''; }
    else if (which === 'dur') { S.durMin = null; S.durMax = null; S.durLabel = ''; }
    else if (which === 'depth') S.depth = null;
    else if (which === 'struct') S.struct = '';
    else if (which === 'pair') S.pair = '';
    $('days').value = String(S.days);
    $('range-box').style.display = S.days === 'custom' ? 'inline-flex' : 'none';
    $('state').value = S.state;
    $('q').value = S.q;
    S.offset = 0;
    syncQuick(); reload(); renderUsers();
  }

  // ============================================================ 统计面板
  function fmtDur(sec) {
    if (sec == null) return '-';
    if (sec < 1) return (sec * 1000).toFixed(0) + 'ms';
    if (sec < 60) return sec.toFixed(sec < 10 ? 1 : 0) + 's';
    var m = Math.floor(sec / 60), r = Math.round(sec % 60);
    if (m < 60) return m + 'm' + (r ? r + 's' : '');
    return Math.floor(m / 60) + 'h' + (m % 60) + 'm';
  }
  function pctText(v) { return v == null ? '-' : (v * 100).toFixed(1) + '%'; }

  // ---------- 图表原语（纯 SVG，零依赖）----------
  // 配色统一在这里定，别散落各处：同一个状态在饼图/柱图/热力图里必须同色，
  // 否则一眼扫过去会把不同东西当成同一类。
  var TONE = {
    done: '#2f855a', failed: '#d64545', cancelled: '#d69e2e', notified: '#3182ce',
    working: '#805ad5', queued: '#718096', silent: '#a0aec0', unknown: '#cbd5e0'
  };
  var SERIES = ['#4c7fd4', '#2f855a', '#d69e2e', '#a0678f', '#3a9188', '#b4693f',
                '#6b6fb8', '#8a9a3b', '#c2565b', '#5b8cb8'];
  var STATE_CN = {
    done: '已完成', failed: '失败', cancelled: '已取消', notified: '单向通知',
    working: '处理中', queued: '排队中', silent: '已静默', unknown: '未知'
  };

  // 环形图。用 pathLength=100 把 dasharray 直接当百分比使，省掉周长换算。
  function donut(items, opt) {
    opt = opt || {};
    var total = items.reduce(function (a, x) { return a + x.value; }, 0);
    if (!total) return '<div class="snote">这个范围内没有数据。</div>';
    var acc = 0;
    var arcs = items.map(function (x) {
      if (!x.value) return '';
      var pct = x.value / total * 100;
      var seg = '<circle cx="60" cy="60" r="42" fill="none" stroke="' + x.color +
        '" stroke-width="17" pathLength="100" stroke-dasharray="' +
        pct.toFixed(3) + ' 100" stroke-dashoffset="' + (-acc).toFixed(3) +
        '" transform="rotate(-90 60 60)"><title>' + esc(x.name) + '　' + x.value +
        '（' + pct.toFixed(1) + '%）</title></circle>';
      acc += pct;
      return seg;
    }).join('');
    var mid = '<text x="60" y="57" class="dnum">' + (opt.centerValue != null ? esc(String(opt.centerValue)) : total) +
      '</text><text x="60" y="73" class="dlab">' + esc(opt.centerLabel || '总计') + '</text>';
    var legend = items.filter(function (x) { return x.value; }).map(function (x) {
      return '<div class="dlgi"' + (x.click ? ' data-jump="' + esc(x.click) + '"' : '') + '>' +
        '<i style="background:' + x.color + '"></i><span class="dn" title="' +
        esc(x.hint || x.name) + '">' + esc(x.name) + '</span>' +
        '<b>' + x.value + '</b><em>' + (x.value / total * 100).toFixed(1) + '%</em></div>';
    }).join('');
    return '<div class="donut"><svg viewBox="0 0 120 120" class="dsvg">' + arcs + mid + '</svg>' +
      '<div class="dlegend">' + legend + '</div></div>';
  }

  // 纵向柱状图。
  // 不用 SVG：viewBox 配 preserveAspectRatio="none" 会把坐标系非等比拉伸，
  // 字会被横向拉宽、纵向压扁，4px 的字号渲染出来根本认不出来（实测看不清）。
  // div 布局里文字就是真实 CSS 像素，多宽都不会变形。
  function vbars(items, opt) {
    opt = opt || {};
    var max = items.reduce(function (m, x) { return Math.max(m, x.value); }, 0) || 1;
    var cols = items.map(function (x) {
      var pct = x.value ? Math.max(x.value / max * 100, 1.5) : 0;
      return '<div class="vbcol' + (x.click ? ' clickable' : '') + '"' +
        (x.click ? ' data-jump="' + esc(x.click) + '"' : '') +
        ' title="' + esc(x.name) + '　' + x.value + (x.click ? '　点击查看' : '') + '">' +
        '<div class="vbbar">' +
          (x.value
            ? '<div class="vbfill" style="height:' + pct.toFixed(2) + '%;background:' +
              (x.color || SERIES[0]) + '"><span class="vbnum">' + x.value + '</span></div>'
            : '<div class="vbfill zero"><span class="vbnum dim">0</span></div>') +
        '</div>' +
        '<div class="vblab">' + esc(x.name) + '</div>' +
      '</div>';
    }).join('');
    return '<div class="vb">' + cols + '</div>' +
      (opt.note ? '<div class="snote">' + opt.note + '</div>' : '');
  }

  // 横向条形图：不引图表库，纯 div 宽度百分比，够用且零依赖
  function barRows(items, opt) {
    opt = opt || {};
    var max = items.reduce(function (m, x) { return Math.max(m, x.value); }, 0) || 1;
    return '<div class="srows">' + items.map(function (x) {
      var w = (x.value / max * 100).toFixed(1);
      return '<div class="srow' + (x.click ? ' clickable' : '') + '"' +
          (x.click ? ' data-jump="' + esc(x.click) + '"' : '') + '>' +
        '<div class="sname" title="' + esc(x.hint || x.name) + '">' + esc(x.name) + '</div>' +
        '<div class="strack"><div class="sfill' + (x.tone ? ' ' + x.tone : '') +
          '" style="width:' + w + '%"></div></div>' +
        '<div class="sval">' + esc(x.text != null ? x.text : x.value) + '</div>' +
      '</div>';
    }).join('') + '</div>' + (opt.note ? '<div class="snote">' + opt.note + '</div>' : '');
  }

  // 趋势：堆叠柱状图。
  // 之前只有色块没有任何标注，鼠标不悬停就完全不知道每根柱子是哪天、有多少条——
  // 现在把日期、数值、刻度线都画出来，不靠 hover 也能读懂。
  function trendChart(trend) {
    if (!trend.length) return '<div class="snote">这个范围内没有数据。</div>';
    var max = trend.reduce(function (m, x) { return Math.max(m, x.total); }, 0) || 1;
    // 纵轴取整到好看的刻度，不然 37 这种数标出来很别扭
    var step = Math.pow(10, Math.floor(Math.log(max) / Math.LN10));
    if (max / step < 2) step = step / 2; else if (max / step > 5) step = step * 2;
    var top = Math.ceil(max / step) * step;
    var n = trend.length;
    // 柱子太多时标签会糊成一团，按间隔抽稀；首尾和峰值必须有标签
    var labelEvery = n <= 10 ? 1 : n <= 20 ? 2 : n <= 40 ? 4 : Math.ceil(n / 10);
    var peakIndex = 0;
    trend.forEach(function (x, i) { if (x.total > trend[peakIndex].total) peakIndex = i; });
    var bars = trend.map(function (x, i) {
      var segs = [
        ['已完成', x.done, TONE.done],
        ['通知', x.notify, TONE.notified],
        ['失败', x.failed, TONE.failed]
      ].filter(function (sg) { return sg[1] > 0; });
      var stack = segs.map(function (sg) {
        return '<i style="flex:' + sg[1] + ';background:' + sg[2] + '" title="' +
          x.date + '　' + sg[0] + ' ' + sg[1] + ' 条"></i>';
      }).join('');
      var pct = (x.total / top * 100).toFixed(2);
      // 首尾、按间隔命中的、以及最高的那根都要有日期——
      // 峰值最容易被追问「这是哪天」，恰恰没标签就很让人抓狂
      var showLabel = i % labelEvery === 0 || i === n - 1 || i === peakIndex;
      // 数值必须跟着柱顶走。放在图表顶端的话，7 和 186 的数字会并排在同一高度，
      // 根本看不出哪个数字属于哪根柱子。
      return '<div class="tcol" title="' + x.date + '　共 ' + x.total + ' 条">' +
        '<div class="tbar">' +
          (x.total
            ? '<div class="tfill" style="height:' + pct + '%">' +
                '<div class="tnum">' + x.total + '</div>' +
                '<div class="tstack">' + stack + '</div>' +
              '</div>'
            : '<div class="tfill zero"><div class="tzero"></div></div>') +
        '</div>' +
        '<div class="tdate' + (i === peakIndex ? ' peak' : '') + '">' +
          (showLabel ? x.date.slice(5) : '') + '</div>' +
      '</div>';
    }).join('');
    // 纵轴刻度线：4 等分
    var grid = [0, 1, 2, 3, 4].map(function (k) {
      var v = Math.round(top * (4 - k) / 4);
      return '<div class="tgline"><span>' + v + '</span></div>';
    }).join('');
    return '<div class="tchart2">' +
        '<div class="tgrid">' + grid + '</div>' +
        '<div class="tcols">' + bars + '</div>' +
      '</div>' +
      '<div class="tlegend2">' +
        '<i style="background:' + TONE.done + '"></i>已完成' +
        '<i style="background:' + TONE.notified + '"></i>单向通知' +
        '<i style="background:' + TONE.failed + '"></i>失败' +
        '<span class="tnote">柱高 = 当天通信总数，颜色 = 结果构成；没有通信的日子留空</span>' +
      '</div>';
  }

  // 时段热力：7×24
  function heatGrid(heat) {
    var dows = ['一', '二', '三', '四', '五', '六', '日'];
    var max = 0;
    heat.forEach(function (row) { row.forEach(function (v) { max = Math.max(max, v); }); });
    var head = '<div class="hrow hhead"><span class="hlab"></span>' +
      Array.apply(null, Array(24)).map(function (_, h) {
        return '<span class="hcell hno">' + (h % 3 === 0 ? h : '') + '</span>';
      }).join('') + '</div>';
    var body = heat.map(function (row, d) {
      return '<div class="hrow"><span class="hlab">' + dows[d] + '</span>' + row.map(function (v, h) {
        var a = max ? v / max : 0;
        var bg = v ? 'rgba(47,133,90,' + (0.12 + a * 0.78).toFixed(2) + ')' : '#f2f4f6';
        return '<span class="hcell" style="background:' + bg + '" title="周' + dows[d] +
          ' ' + h + ':00  ' + v + ' 条"></span>';
      }).join('') + '</div>';
    }).join('');
    return '<div class="heat">' + head + body + '</div>' +
      '<div class="snote">颜色越深表示该时段通信越多，峰值 ' + max + ' 条。悬停看具体数值。</div>';
  }

  function loadAnalytics() {
    var p = new URLSearchParams();
    if (S.days === 'custom' && (S.from || S.to)) { if (S.from) p.set('from', S.from); if (S.to) p.set('to', S.to); }
    else p.set('days', String(S.days));
    if (S.user) { p.set('user', S.user); if (S.role !== 'all') p.set('role', S.role); }
    if (S.state && S.state !== 'all') p.set('state', S.state);
    if (S.q) p.set('q', S.q);
    syncQuick();
    return api('/api/trace/analytics?' + p.toString()).then(function (d) {
      if (S.view !== 'stats') return;
      renderAnalytics(d);
    }).catch(function (e) {
      $('stats-body').innerHTML = '<div class="empty"><div class="big">统计加载失败</div><div>' +
        esc(String(e && e.message || e)) + '</div></div>';
    });
  }

  function renderAnalytics(d) {
    var o = d.overview, box = $('stats-body');

    // ---------- 顶部：范围说明 ----------
    var scope = [];
    if (d.filter.user) scope.push('用户 ' + d.filter.user);
    if (d.filter.state && d.filter.state !== 'all') scope.push('状态 ' + d.filter.state);
    if (d.filter.q) scope.push('关键词「' + d.filter.q + '」');
    var rangeText = d.since ? (new Date(d.since * 1000).toLocaleDateString() + ' 至今') : '全部历史';
    var head = '<div class="abar"><b>' + esc(rangeText) + '</b>' +
      (scope.length ? '<span class="asep">·</span>' + esc(scope.join(' · ')) : '') +
      '<span class="asep">·</span>' + o.total + ' 条通信' +
      (d.truncated ? '<span class="swarn">超过 ' + d.scanned + ' 条上限，以下为部分样本</span>' : '') +
      '<span class="agrow"></span><span class="ahint">改上面的筛选条件，这里的统计会跟着变</span></div>';

    // ---------- 四个核心指标 ----------
    var rate = o.success_rate;
    var hero = '<div class="ahero">' +
      heroCell('总通信', o.total, o.request_total + ' 请求 · ' + o.notify_total + ' 通知', '') +
      heroCell('成功率', rate == null ? '-' : (rate * 100).toFixed(1) + '%',
               '分母 ' + o.judged + ' 条，已排除通知', rate == null ? '' : (rate >= 0.95 ? 'ok' : rate >= 0.85 ? 'warn' : 'bad')) +
      heroCell('失败', o.failed + (o.cancelled ? ' + ' + o.cancelled : ''),
               o.cancelled ? '失败 + 撤回' : '失败', o.failed ? 'bad' : 'ok') +
      heroCell('P95 耗时', fmtDur(o.p95), '中位 ' + fmtDur(o.p50) + ' · 最慢 ' + fmtDur(o.max_seconds), '') +
      '</div>';

    // ---------- 趋势（通栏）----------
    var tr = card('通信趋势', trendChart(d.trend || []), 'wide');

    // ---------- 状态分布（饼）----------
    // 每种状态都能点，不只是失败。后端 state 参数本来就支持这几个值。
    var stItems = (d.by_state || []).map(function (x) {
      return {name: STATE_CN[x.state] || x.state, value: x.count,
              color: TONE[x.state] || '#cbd5e0',
              click: x.state ? 'state=' + x.state : ''};
    });
    var pie1 = card('状态分布', donut(stItems, {centerLabel: '条通信'}));

    // ---------- 失败原因（饼）----------
    var f = d.failures || {};
    // 只显中文名。error_code 那种字段名是给排查代码的人看的，
    // 看板的读者要的是「为什么失败」，不是「哪个枚举值」。
    var errItems = (f.by_code || []).map(function (x, i) {
      // 以前这里对四个原因全写死 'state=failed'，所以点哪个都跳到「全部失败」。
      // 必须把 error_code 带上，后端才知道你要看的是哪一种。
      // state 也不能写死：「发起方撤回」那批实际是 cancelled，
      // 配上 state=failed 两个条件互斥，结果是 0 条（实测踩过）。
      var sts = x.states || [];
      var stq = sts.length === 1 ? sts[0] : 'all';
      return {name: x.label || x.code, value: x.count, color: SERIES[i % SERIES.length],
              hint: x.hint || '',
              click: 'state=' + stq + '&error=' + encodeURIComponent(x.code)};
    });
    var pie2 = card('失败原因',
      (errItems.length
        ? donut(errItems, {centerLabel: '次失败'}) +
          '<div class="snote">' + (f.by_code || []).map(function (x) {
            return x.hint ? '<b>' + esc(x.label || x.code) + '</b>：' + esc(x.hint) : '';
          }).filter(Boolean).join('<br>') + '</div>'
        : '<div class="snote">这个范围内没有失败或撤回。</div>'));

    // ---------- 耗时分布（纵柱）----------
    var du = d.durations || {buckets: [], slowest: []};
    var dur = card('耗时分布', vbars((du.buckets || []).map(function (x, i) {
      var q = 'dur_min=' + x.lo + (x.hi === null || x.hi === undefined ? '' : '&dur_max=' + x.hi);
      return {name: x.label, value: x.count, color: SERIES[0], click: q};
    }), {note: '只统计真正等过对端的请求，' + o.timed + ' 条参与计算；单向通知投递即终结，不计入。'}));

    // ---------- 通信结构（饼）----------
    var st = d.structure || {};
    var stru = card('通信结构', donut([
      {name: '跨用户', value: st.cross_user || 0, color: SERIES[0], click: 'struct=cross'},
      {name: '同用户不同会话', value: st.same_user || 0, color: SERIES[4], click: 'struct=self'}
    ], {centerLabel: '条通信'}));

    // ---------- 链路深度（纵柱）----------
    // 「1 层」「2 层」这种标签没人看得懂在说什么，改成直白描述
    var depthName = ['直接发起', '转派 1 次', '转派 2 次', '转派 3 次', '转派 4 次'];
    var depth = card('任务转派情况', vbars((st.depth || []).map(function (x) {
      return {name: depthName[x.depth] || ('转派 ' + x.depth + ' 次'), value: x.count,
              color: x.depth === 0 ? '#9fb3c8' : SERIES[1],
              click: 'depth=' + x.depth};
    }), {note: '「直接发起」是本人直接发出的任务；「转派 N 次」表示这条任务是被层层转交 N 手之后才到达执行方的。'}));

    // ---------- 失败归因（横条）----------
    var fbar = '';
    if ((f.by_user || []).length) {
      fbar = card('失败集中在谁身上',
        '<div class="ssub">按发起用户</div>' +
        barRows((f.by_user || []).map(function (x) {
          return {name: x.user, value: x.count, tone: 'bad', click: 'user=' + x.user + '&state=failed'};
        })) +
        '<div class="ssub">按会话对</div>' +
        barRows((f.by_pair || []).map(function (x) {
          return {name: x.pair, value: x.count, tone: 'bad',
                  click: 'state=failed&pair=' + encodeURIComponent(x.pair)};
        })) +
        '<div class="snote"><b>已取消</b>里混着「实际是对端离线、但随后被撤回覆盖」的记录' +
        '（中继状态机的已知问题：失败终态会被后到的 cancel 冲掉），所以这里的归因偏保守。</div>');
    }

    // ---------- 参与者（通栏表）----------
    var pa = card('参与者', '<table class="stable"><thead><tr>' +
      '<th>用户</th><th>发起</th><th>处理</th><th>失败</th><th>平均耗时</th></tr></thead><tbody>' +
      (d.participants || []).map(function (x) {
        return '<tr data-user="' + esc(x.user) + '"><td>' + esc(x.user) + '</td><td>' + x.sent +
          '</td><td>' + x.handled + '</td><td class="' + (x.failed ? 'bad' : '') + '">' +
          x.failed + '</td><td>' + fmtDur(x.avg_seconds) + '</td></tr>';
      }).join('') + '</tbody></table>', 'wide');

    // ---------- 会话对热度（横条）----------
    var pairs = card('谁和谁在通信', barRows((d.pairs || []).map(function (x, i) {
      return {name: x.pair, value: x.count,
              click: 'pair=' + encodeURIComponent(x.pair)};
    })));

    // ---------- 最慢请求 ----------
    var slow = card('最慢的请求',
      (du.slowest || []).length
        ? '<div class="slowlist">' + du.slowest.map(function (x) {
            return '<div class="slow" data-goto="' + esc(x.task_id) + '">' +
              '<span class="stime">' + fmtDur(x.seconds) + '</span>' +
              '<span class="sway">' + esc(x.requester) + ' → ' + esc(x.handler) + '</span>' +
              '<span class="ssum">' + (esc(x.summary) || '（无摘要）') + '</span></div>';
          }).join('') + '</div>'
        : '<div class="snote">没有可计时的请求。</div>');

    // ---------- 时段热力（通栏）----------
    var hm = card('时段分布', heatGrid(d.heatmap || []), 'wide');

    box.innerHTML = head + hero +
      '<div class="agrid">' + tr + pie1 + pie2 + dur + stru + depth + fbar + pairs + slow + pa + hm + '</div>';
  }

  function heroCell(label, value, sub, tone) {
    return '<div class="hcard"><div class="hk">' + esc(label) + '</div>' +
      '<div class="hv ' + (tone || '') + '">' + esc(String(value)) + '</div>' +
      '<div class="hs">' + esc(sub) + '</div></div>';
  }
  function card(title, body, cls) {
    return '<section class="acard ' + (cls || '') + '"><h3>' + esc(title) + '</h3>' + body + '</section>';
  }


  function switchView(v) {
    if (S.view === v) return;
    S.view = v; S.offset = 0;
    close();
    Array.prototype.forEach.call(document.querySelectorAll('#view-tabs .sg'), function (el) {
      el.classList.toggle('on', el.getAttribute('data-view') === v);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.link-st'), function (el) {
      el.classList.toggle('hide', v !== 'links');
    });
    // 统计视图有自己的容器，列表和分页在这个视图下没有意义
    var isStats = v === 'stats';
    $('stats-body').style.display = isStats ? '' : 'none';
    $('task-body').style.display = isStats ? 'none' : '';
    if (isStats) {
      $('stats-body').innerHTML = '<div class="empty"><div class="big">加载中…</div></div>';
    } else {
      // 问题视角只看失败，状态下拉对它没意义，填了反而让人以为能按状态筛
      if (v !== 'issues') fillState();
      $('task-body').innerHTML = '<div class="empty"><div class="big">加载中…</div></div>';
    }
    reload();
  }
  var timer = null;
  function schedule(id) {
    if (id) S.flash[id] = true;
    if (timer) return;
    timer = setTimeout(function () { timer = null; reload(); }, 700);
  }
  function live(on, text) {
    $('live-dot').className = 'd' + (on ? ' on' : ' off');
    $('live-text').textContent = text;
  }
  function stream() {
    if (!window.EventSource) { live(false, '轮询'); return; }
    var es = new EventSource('/api/trace/stream');
    es.addEventListener('hello', function (ev) {
      live(true, '实时');
      try {
        var d = JSON.parse(ev.data);
        S.retention = d.retention === 'forever' ? '永久' : (d.retention || '');
        renderStats();
      } catch (e) { /* 非关键 */ }
    });
    es.addEventListener('task', function (ev) {
      try { schedule((JSON.parse(ev.data).task || {}).task_id); } catch (e) { schedule(); }
    });
    es.onopen = function () { live(true, '实时'); };
    es.onerror = function () { live(false, '重连中'); };
  }

  // ============================================================ 事件
  $('days').addEventListener('change', function () {
    if (this.value === 'custom') {
      S.days = 'custom';
      $('range-box').style.display = 'inline-flex';
      if (!S.from && !S.to) return;
    } else {
      S.days = parseInt(this.value, 10);
      $('range-box').style.display = 'none';
    }
    S.offset = 0; syncQuick(); reload();
  });
  $('from').addEventListener('change', function () { S.from = this.value; S.offset = 0; reload(); });
  $('to').addEventListener('change', function () { S.to = this.value; S.offset = 0; reload(); });
  $('limit').addEventListener('change', function () { S.limit = parseInt(this.value, 10); S.offset = 0; loadList(); });
  $('state').addEventListener('change', function () { S.state = this.value; S.offset = 0; syncQuick(); loadList(); });
  var qt = null;
  $('q').addEventListener('input', function () {
    var v = this.value;
    clearTimeout(qt);
    qt = setTimeout(function () { S.q = v; S.offset = 0; loadList(); }, 260);
  });
  $('user-q').addEventListener('input', function () { S.userQ = this.value; renderUsers(); });
  $('user-list').addEventListener('click', function (e) {
    var el = e.target.closest('[data-user]');
    if (!el) return;
    S.user = el.getAttribute('data-user');
    S.offset = 0;
    if (!S.user) S.role = 'all';
    Array.prototype.forEach.call(document.querySelectorAll('#role-tabs .tb'), function (t) {
      t.classList.toggle('on', t.getAttribute('data-role') === S.role);
    });
    renderUsers(); loadList();
  });
  // 快捷筛选条：点一下即筛，并把顶部下拉同步过去
  $('quick-bar').addEventListener('click', function (e) {
    var el = e.target.closest('.qc'); if (!el) return;
    var k = el.getAttribute('data-q'), v = el.getAttribute('data-v');
    if (k === 'days') {
      S.days = parseInt(v, 10);
      $('days').value = v;
      $('range-box').style.display = 'none';
    } else {
      S.state = v;
      $('state').value = v;
    }
    S.offset = 0; syncQuick(); loadList();
  });
  // 筛选态里的 × 与「全部清除」
  $('filter-bar').addEventListener('click', function (e) {
    var el = e.target.closest('[data-drop]'); if (!el) return;
    dropFilter(el.getAttribute('data-drop'));
  });
  // 统计面板里的可点项：跳回列表并带上筛选
  $('stats-body').addEventListener('click', function (e) {
    var jump = e.target.closest('[data-jump]');
    if (jump) {
      var qs = new URLSearchParams(jump.getAttribute('data-jump'));
      // 这里以前只读 state 和 user，其余参数直接丢掉，
      // 所以点四个失败原因跳出来的结果全是「全部失败」。
      // 现在每次下钻先把五个扩展维度清干净，再按本次点击重建，
      // 否则连续点两个图表会把条件叠在一起，筛出空结果。
      S.error = ''; S.errorLabel = '';
      S.durMin = null; S.durMax = null; S.durLabel = '';
      S.depth = null; S.struct = ''; S.pair = '';
      S.state = qs.get('state') || 'all';
      if (qs.get('user')) { S.user = qs.get('user'); S.role = 'all'; }
      if (qs.get('error')) {
        S.error = qs.get('error');
        // 筛选条要显中文，不能把 error_code 抹给用户看
        var chip = jump.querySelector('.dn') || jump.querySelector('.sname');
        S.errorLabel = chip ? chip.textContent : S.error;
      }
      if (qs.get('dur_min') != null || qs.get('dur_max') != null) {
        S.durMin = qs.get('dur_min') != null ? Number(qs.get('dur_min')) : null;
        S.durMax = qs.get('dur_max') != null ? Number(qs.get('dur_max')) : null;
        var lab = jump.querySelector('.vblab');
        S.durLabel = lab ? lab.textContent : '';
      }
      if (qs.get('depth') != null) S.depth = Number(qs.get('depth'));
      if (qs.get('struct')) S.struct = qs.get('struct');
      if (qs.get('pair')) S.pair = qs.get('pair');
      S.offset = 0;
      switchView('links');
      $('state').value = S.state;
      syncQuick(); renderUsers();
      return;
    }
    var row = e.target.closest('[data-user]');
    if (row) { S.user = row.getAttribute('data-user'); S.role = 'all'; S.offset = 0;
      syncQuick(); renderUsers(); loadAnalytics(); return; }
    var slow = e.target.closest('[data-goto]');
    if (slow) { S.q = slow.getAttribute('data-goto'); $('q').value = S.q;
      switchView('links'); syncQuick(); return; }
  });
  $('view-tabs').addEventListener('click', function (e) {
    var el = e.target.closest('[data-view]');
    if (el) switchView(el.getAttribute('data-view'));
  });
  $('role-tabs').addEventListener('click', function (e) {
    var el = e.target.closest('[data-role]');
    if (!el) return;
    S.role = el.getAttribute('data-role');
    S.offset = 0;
    Array.prototype.forEach.call(document.querySelectorAll('#role-tabs .tb'), function (t) { t.classList.remove('on'); });
    el.classList.add('on');
    loadList();
  });
  $('task-body').addEventListener('toggle',function(e){if(e.target.matches('details[data-group]'))groupOpen.set(e.target.dataset.group,e.target.open);},true);
  $('task-body').addEventListener('click', function (e) {
    if (e.target.id === 'pg-prev') { S.offset = Math.max(0, S.offset - pageSize()); loadList(); return; }
    if (e.target.id === 'pg-next') { S.offset += pageSize(); loadList(); return; }
    // 问题卡片：点一条就把该根因的具体链路筛出来
    var iss = e.target.closest('[data-issue-error]');
    if (iss) {
      S.error = iss.getAttribute('data-issue-error');
      S.errorLabel = iss.getAttribute('data-issue-label') || S.error;
      S.pair = iss.getAttribute('data-issue-pair') || '';
      // 聚合里 cancelled 和 failed 都算失败，这里不能再卡 state，
      // 否则「发起方撤回」那类会筛空
      S.state = 'all';
      S.durMin = null; S.durMax = null; S.durLabel = '';
      S.depth = null; S.struct = '';
      S.offset = 0;
      switchView('links');
      $('state').value = S.state;
      syncQuick(); renderUsers();
      return;
    }
    var lk = e.target.closest('[data-link]');
    var chainMap = e.target.closest('[data-chain-root]');
    if (chainMap) { openChain(chainMap.getAttribute('data-chain-root')); return; }
    var branch=e.target.closest('[data-open-branch]');if(branch){openBranch(branch.dataset.openBranch);return;}
    if (lk) { var group=lk.closest('[data-group]');if(group)openBranch(group.dataset.group,lk.dataset.link);else openLink(lk.dataset.link);return; }
    var tk = e.target.closest('[data-id]');
    if (tk) {
      var id = tk.getAttribute('data-id');
      // 链路视图里点具体环节，也该看到「这件事怎么跑的」——
      // 走 openTask 会拉出按会话扩散的全量图，把别的任务的通信也混进来。
      if (S.view === 'links') {
        var owner = null;
        for (var gi = 0; gi < S.groups.length; gi++) {
          for (var ni = 0; ni < S.groups[gi].nodes.length; ni++) {
            if (S.groups[gi].nodes[ni].task_id === id) { owner = S.groups[gi].root_id; break; }
          }
          if (owner) break;
        }
        if (owner) { openChain(owner, id); return; }
      }
      openTask(id);
    }
  });
  $('d-close').addEventListener('click', close);
  // 调用链行点击：在同一个抽屉里跳到另一个任务，不关闭抽屉
  $('d-body').addEventListener('click', function (e) {
    var c = e.target.closest('[data-chain]');
    if (c) openTask(c.getAttribute('data-chain'));
  });
  $('backdrop').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

  // ============================================================ 启动
  // 启动时不走 switchView，所以容器的显隐要在这里按默认视图先对好，
  // 否则默认进统计页时会看到空白（面板还是 display:none）。
  (function () {
    var isStats = S.view === 'stats';
    $('stats-body').style.display = isStats ? '' : 'none';
    $('task-body').style.display = isStats ? 'none' : '';
    Array.prototype.forEach.call(document.querySelectorAll('.link-st'), function (el) {
      el.classList.toggle('hide', S.view !== 'links');
    });
  })();
  fillState();
  reload();
  stream();
  setInterval(function () {
    if (document.hidden) return;
    var now = Date.now() / 1000;
    Array.prototype.forEach.call(document.querySelectorAll('.dur[data-since]'), function (el) {
      var since = parseFloat(el.getAttribute('data-since'));
      if (since) el.textContent = dur(now - since);
    });
  }, 1000);
  setInterval(function () { if (!document.hidden) reload(); }, 10000);
})();
</script>
</body>
</html>
